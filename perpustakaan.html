<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5D4037">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>📚 Perpustakaan Aslan — Keluarga Sejati</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#4CAF50;--green-dark:#2E7D32;
  --amber:#F57F17;
  --brown:#5D4037;--brown-light:#8D6E63;--brown-dark:#3E2723;
  --cream:#FFF8E1;
  --orange:#E65100;--teal:#00695C;
  --indigo:#1A237E;--indigo-mid:#283593;
}
html,body{margin:0;padding:0;width:100%;min-height:100vh;}
body{font-family:'Nunito',sans-serif;background:#6b9e6b;display:flex;justify-content:center;align-items:flex-start;}

#app-wrapper{
  width:100%;max-width:600px;min-height:100vh;
  background-color:var(--cream);
  background-image:radial-gradient(circle,rgba(141,110,99,0.12) 2px,transparent 2px),linear-gradient(rgba(141,110,99,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(141,110,99,0.05) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,32px 32px;
  background-position:16px 16px,0 0,0 0;
  box-shadow:0 0 80px rgba(0,0,0,0.3);
  padding-bottom:60px;position:relative;overflow-x:hidden;
}

@media(min-width:600px) and (max-width:900px){
  body{background:#FFF8E1;}
  #app-wrapper{max-width:100%;box-shadow:none;}
  .books-grid{grid-template-columns:repeat(3,1fr)!important;}
  .header-title{font-size:16px!important;}
}
@media(min-width:900px){
  body{background:#5a8a5a;align-items:flex-start;padding:24px 0;}
  #app-wrapper{max-width:860px;border-radius:20px;margin:0 auto;min-height:auto;}
  .books-grid{grid-template-columns:repeat(4,1fr)!important;}
  .header-title{font-size:16px!important;}
  .main{padding:20px 28px!important;}
}
@media(max-width:360px){
  .books-grid{grid-template-columns:repeat(2,1fr)!important;}
  .header-title{font-size:11px!important;}
}

/* ═══ HEADER ═══ */
.header{
  padding:18px 20px 36px;position:relative;overflow:hidden;
}
.header.coding-header{background:linear-gradient(135deg,#3E2723 0%,#5D4037 50%,#6D4C41 100%);}
.header.english-header{background:linear-gradient(135deg,#0D2B6B 0%,#1A3F9E 50%,#2756C5 100%);}

.header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:20px;
  border-top:3px solid rgba(0,0,0,0.3);
}
.coding-header::after{background:repeating-linear-gradient(90deg,#5D4037 0,#5D4037 29px,#4E342E 29px,#4E342E 30px);}
.english-header::after{background:repeating-linear-gradient(90deg,#1A3F9E 0,#1A3F9E 29px,#0D2B6B 29px,#0D2B6B 30px);}

.header::before{
  content:'';position:absolute;bottom:20px;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0.15) 0,rgba(255,255,255,0.15) 14px,transparent 14px,transparent 30px);
}

.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.back-btn{
  background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:5px 14px;color:#FFCC80;font-size:11px;
  font-weight:800;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:5px;
  transition:all 0.2s;
}
.back-btn:hover{background:rgba(255,255,255,0.25);}
.date-badge{
  background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:5px 14px;color:#FFCC80;font-size:11px;font-weight:700;
}
.header-hero{display:flex;align-items:center;gap:16px;}
.library-icon-wrap{
  width:72px;height:72px;border:4px solid #FFCC80;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:36px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,0.2),0 4px 12px rgba(0,0,0,0.3);
  flex-shrink:0;position:relative;overflow:hidden;
}
.coding-icon{background:linear-gradient(135deg,#FF8F00,#FFB300);}
.english-icon{background:linear-gradient(135deg,#1565C0,#42A5F5);}
.sains-icon{background:linear-gradient(135deg,#2E7D32,#66BB6A);}
.library-icon-wrap::before{
  content:'';position:absolute;top:4px;left:6px;right:6px;height:6px;
  background:rgba(255,255,255,0.3);border-radius:3px;
}
.header-title{font-family:'Press Start 2P',monospace;font-size:14px;color:#FFCC80;text-shadow:3px 3px 0 rgba(0,0,0,0.4);line-height:1.5;}
.header-sub{color:#FFCC80;opacity:0.8;font-size:11px;font-weight:700;margin-top:5px;line-height:1.6;}
.progress-wrap{margin-top:10px;}
.progress-label{display:flex;justify-content:space-between;color:#FFCC80;font-size:11px;font-weight:700;margin-bottom:5px;opacity:0.9;}
.progress-track{height:14px;background:rgba(0,0,0,0.3);border-radius:3px;border:2px solid rgba(255,255,255,0.2);overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width 0.8s ease;position:relative;}
.coding-progress{background:linear-gradient(90deg,#FFB300,#FFD54F);}
.english-progress{background:linear-gradient(90deg,#29B6F6,#80DEEA);}
.sains-progress{background:linear-gradient(90deg,#66BB6A,#A5D6A7);}
.progress-fill::after{content:'';position:absolute;top:2px;left:4px;right:4px;height:4px;background:rgba(255,255,255,0.35);border-radius:2px;}

.float-deco{position:absolute;pointer-events:none;font-size:20px;opacity:0.2;}
@keyframes floatDeco{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(8deg)}}

/* ═══ COLLECTION TABS ═══ */
.collection-tabs{
  display:flex;gap:0;margin:0;border-bottom:3px solid #D7CCC8;
  background:#EFEBE9;
}
.tab-btn{
  flex:1;padding:10px 6px;border:none;background:transparent;
  font-family:'Press Start 2P',monospace;font-size:6px;cursor:pointer;
  color:#90A4AE;transition:all 0.2s;border-bottom:3px solid transparent;
  margin-bottom:-3px;display:flex;align-items:center;justify-content:center;gap:5px;
}
.tab-btn.active.coding-tab{color:#5D4037;border-bottom-color:#5D4037;background:#FFF8E1;}
.tab-btn.active.english-tab{color:#1A237E;border-bottom-color:#1A237E;background:#E8EAF6;}
.tab-btn.active.sains-tab{color:#1B5E20;border-bottom-color:#1B5E20;background:#F1F8E9;}
.tab-btn:hover:not(.active){background:rgba(0,0,0,0.04);}

/* ═══ MAIN ═══ */
.main{padding:16px 14px;}

/* ═══ STATS ROW ═══ */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.stat-card{
  background:white;border-radius:14px;padding:14px 10px;
  border:3px solid #D7CCC8;border-bottom:5px solid #BCAAA4;
  text-align:center;position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:14px 14px 0 0;}
.stat-card.read-card::before{background:var(--green);}
.stat-card.locked-card::before{background:#EF9A9A;}
.stat-card.today-card.coding::before{background:var(--amber);}
.stat-card.today-card.english::before{background:#1565C0;}
.stat-card.today-card.sains::before{background:#2E7D32;}
.stat-num{font-family:'Press Start 2P',monospace;font-size:20px;color:#5D4037;}
.stat-label{font-size:9px;font-weight:800;color:#90A4AE;margin-top:5px;text-transform:uppercase;letter-spacing:0.5px;}

/* ═══ TODAY HIGHLIGHT ═══ */
.today-book-wrap{width:100%;margin-bottom:20px;box-sizing:border-box;}
.today-book-card{
  display:block;width:100%!important;box-sizing:border-box!important;
  border-radius:18px;padding:20px;border:3px solid #E65100;
  position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.today-book-card::before{content:'📖';position:absolute;right:12px;bottom:10px;font-size:56px;opacity:0.12;}
.today-book-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.25);border:1.5px solid rgba(255,255,255,0.4);
  border-radius:20px;padding:3px 12px;font-size:10px;font-weight:800;color:white;margin-bottom:10px;
}
.today-book-title{font-family:'Press Start 2P',monospace;font-size:9px;color:white;text-shadow:1px 1px 0 rgba(0,0,0,0.2);line-height:1.6;margin-bottom:8px;word-break:break-word;}
.today-book-btn{
  display:inline-block;background:white;border:none;border-radius:12px;padding:12px 24px;
  font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,0.15);transition:all 0.1s;text-decoration:none;
  border-bottom:4px solid rgba(0,0,0,0.1);
}
.today-book-btn.coding-btn{color:#E65100;}
.today-book-btn.english-btn{color:#1565C0;}
.today-book-btn.sains-btn{color:#1B5E20;}
.today-book-btn:hover{transform:translateY(-2px);}
.today-book-btn:active{transform:translateY(2px);}

/* ═══ COMING SOON CARD ═══ */
.coming-soon-card{
  background:linear-gradient(135deg,#1B5E20,#2E7D32);
  border-radius:18px;padding:24px 20px;
  text-align:center;position:relative;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,0.2);border:3px solid #1B5E20;
  margin-bottom:20px;
}
.coming-soon-card::before{content:'🔬';position:absolute;right:12px;bottom:10px;font-size:60px;opacity:0.12;}
.coming-soon-emoji{font-size:48px;margin-bottom:12px;}
.coming-soon-title{font-family:'Press Start 2P',monospace;font-size:10px;color:#FFCC80;text-shadow:2px 2px 0 rgba(0,0,0,0.3);line-height:1.6;margin-bottom:10px;}
.coming-soon-date{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);
  border-radius:20px;padding:8px 20px;font-size:12px;font-weight:800;color:white;
}

/* ═══ WEEK TITLE ═══ */
.week-title{
  font-family:'Press Start 2P',monospace;font-size:8px;color:#5D4037;
  letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#EFEBE9,#D7CCC8);
  border-radius:12px;padding:10px 14px;border:2px solid #BCAAA4;border-left:5px solid #8D6E63;
}
.week-title.english{color:#1A237E;background:linear-gradient(135deg,#E8EAF6,#C5CAE9);border-color:#9FA8DA;border-left-color:#3949AB;}
.week-title.sains{color:#1B5E20;background:linear-gradient(135deg,#F1F8E9,#DCEDC8);border-color:#AED581;border-left-color:#558B2F;}
.week-title-emoji{font-size:18px;flex-shrink:0;}

/* ═══ BOOK GRID ═══ */
.books-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}

/* ═══ BOOK CARD ═══ */
.book-card{
  background:white;border-radius:16px;border:3px solid #D7CCC8;border-bottom:5px solid #BCAAA4;
  cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;
  position:relative;overflow:hidden;text-decoration:none;display:block;
}
.book-card:hover:not(.locked){transform:translateY(-4px);box-shadow:0 10px 0 rgba(0,0,0,0.1);}
.book-card:active:not(.locked){transform:translateY(2px);border-bottom-width:2px;}
.book-card.locked{cursor:not-allowed;opacity:0.75;filter:grayscale(0.3);}
.book-card.read{border-color:var(--green)!important;border-bottom-color:#2E7D32!important;}
.book-card.today-book-card-item{animation:todayPulse 2s ease-in-out infinite;}
@keyframes todayPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,152,0,0.3)}50%{box-shadow:0 0 0 6px rgba(255,152,0,0)}}

.book-spine{width:8px;position:absolute;left:0;top:0;bottom:0;border-radius:16px 0 0 16px;}
.book-cover{padding:14px 12px 12px 18px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;}
.book-cover-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.book-emoji{font-size:28px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.15));}
.book-num-badge{font-family:'Press Start 2P',monospace;font-size:9px;padding:3px 8px;border-radius:8px;color:white;flex-shrink:0;}
.book-title{font-size:12px;font-weight:900;color:#3E2723;line-height:1.35;margin-bottom:6px;}
.book-card.locked .book-title{color:#90A4AE;}
.book-footer{display:flex;align-items:center;justify-content:space-between;}
.book-status{font-size:9px;font-weight:800;padding:3px 9px;border-radius:10px;}
.book-day{font-size:9px;font-weight:700;color:#BDBDBD;}

.status-today{background:#FFF3E0;color:#E65100;border:1.5px solid #FFB74D;}
.status-today-en{background:#E8EAF6;color:#283593;border:1.5px solid #7986CB;}
.status-today-sains{background:#F1F8E9;color:#2E7D32;border:1.5px solid #81C784;}
.status-read{background:#E8F5E9;color:#2E7D32;border:1.5px solid #81C784;}
.status-locked{background:#F5F5F5;color:#BDBDBD;border:1.5px solid #E0E0E0;}

.book-lock-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(255,255,255,0.4);border-radius:14px;
}
.lock-icon{font-size:28px;margin-bottom:4px;}
.lock-text{font-size:9px;font-weight:800;color:#90A4AE;}
.read-check{
  position:absolute;top:-2px;right:-2px;width:28px;height:28px;
  background:var(--green);border-radius:50%;border:3px solid white;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:13px;font-weight:900;
  box-shadow:0 2px 8px rgba(76,175,80,0.4);z-index:2;
}

/* ═══ SHELF DECORATION ═══ */
.shelf-deco{height:16px;margin:0 -14px 20px;border-top:3px solid rgba(0,0,0,0.25);border-bottom:3px solid rgba(0,0,0,0.15);position:relative;}
.shelf-deco.coding{background:linear-gradient(135deg,#5D4037,#6D4C41);}
.shelf-deco.english{background:linear-gradient(135deg,#283593,#3949AB);}
.shelf-deco.sains{background:linear-gradient(135deg,#2E7D32,#388E3C);}
.shelf-deco::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,rgba(255,255,255,0.1) 0,rgba(255,255,255,0.1) 19px,transparent 19px,transparent 20px);}

/* ═══ MOTIVATION ═══ */
.motivation-card{border-radius:16px;padding:16px 18px;margin-bottom:16px;border:3px solid;position:relative;overflow:hidden;}
.motivation-card.coding{background:linear-gradient(135deg,#1B5E20,#2E7D32);border-color:#1B5E20;}
.motivation-card.english{background:linear-gradient(135deg,#0D1F6B,#1A3F9E);border-color:#0D1F6B;}
.motivation-card.sains{background:linear-gradient(135deg,#004D40,#00695C);border-color:#004D40;}
.motivation-card::before{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:36px;opacity:0.12;}
.motivation-card.coding::before{content:'💡';}
.motivation-card.english::before{content:'🌟';}
.motivation-card.sains::before{content:'🔬';}
.motivation-text{font-size:12px;font-weight:700;color:#C8E6C9;line-height:1.7;font-style:italic;}
.motivation-card.english .motivation-text{color:#C5CAE9;}
.motivation-card.sains .motivation-text{color:#B2DFDB;}

/* ═══ CODING WEEK COLORS ═══ */
.book-card.cw1{border-color:#90CAF9;border-bottom-color:#1565C0;}
.book-card.cw2{border-color:#A5D6A7;border-bottom-color:#2E7D32;}
.book-card.cw3{border-color:#FFAB91;border-bottom-color:#E65100;}
.book-card.cw4{border-color:#CE93D8;border-bottom-color:#6A1B9A;}
.book-card.cw5{border-color:#80CBC4;border-bottom-color:#00695C;}
.spine-cw1{background:linear-gradient(180deg,#1565C0,#0D47A1);}
.spine-cw2{background:linear-gradient(180deg,#2E7D32,#1B5E20);}
.spine-cw3{background:linear-gradient(180deg,#E65100,#BF360C);}
.spine-cw4{background:linear-gradient(180deg,#6A1B9A,#4A148C);}
.spine-cw5{background:linear-gradient(180deg,#00695C,#004D40);}
.num-cw1{background:#1565C0;}.num-cw2{background:#2E7D32;}.num-cw3{background:#E65100;}.num-cw4{background:#6A1B9A;}.num-cw5{background:#00695C;}

/* ═══ ENGLISH WEEK COLORS ═══ */
.book-card.ew1{border-color:#90CAF9;border-bottom-color:#0D47A1;}
.book-card.ew2{border-color:#80DEEA;border-bottom-color:#00695C;}
.book-card.ew3{border-color:#B39DDB;border-bottom-color:#4527A0;}
.book-card.ew4{border-color:#F48FB1;border-bottom-color:#880E4F;}
.book-card.ew5{border-color:#FFCC80;border-bottom-color:#E65100;}
.spine-ew1{background:linear-gradient(180deg,#0D47A1,#01579B);}
.spine-ew2{background:linear-gradient(180deg,#00695C,#004D40);}
.spine-ew3{background:linear-gradient(180deg,#4527A0,#311B92);}
.spine-ew4{background:linear-gradient(180deg,#880E4F,#4A148C);}
.spine-ew5{background:linear-gradient(180deg,#E65100,#BF360C);}
.num-ew1{background:#0D47A1;}.num-ew2{background:#00695C;}.num-ew3{background:#4527A0;}.num-ew4{background:#880E4F;}.num-ew5{background:#E65100;}

/* ═══ SAINS WEEK COLORS ═══ */
.book-card.sw1{border-color:#80CBC4;border-bottom-color:#00695C;}
.book-card.sw2{border-color:#FFCC80;border-bottom-color:#E65100;}
.book-card.sw3{border-color:#EF9A9A;border-bottom-color:#C62828;}
.book-card.sw4{border-color:#B39DDB;border-bottom-color:#283593;}
.book-card.sw5{border-color:#A5D6A7;border-bottom-color:#1B5E20;}
.spine-sw1{background:linear-gradient(180deg,#00695C,#004D40);}
.spine-sw2{background:linear-gradient(180deg,#E65100,#BF360C);}
.spine-sw3{background:linear-gradient(180deg,#C62828,#B71C1C);}
.spine-sw4{background:linear-gradient(180deg,#283593,#1A237E);}
.spine-sw5{background:linear-gradient(180deg,#1B5E20,#33691E);}
.num-sw1{background:#00695C;}.num-sw2{background:#E65100;}.num-sw3{background:#C62828;}.num-sw4{background:#283593;}.num-sw5{background:#1B5E20;}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-120px);
  background:#3E2723;color:white;padding:12px 28px;border-radius:50px;
  font-size:13px;font-weight:800;transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  z-index:600;box-shadow:0 6px 24px rgba(0,0,0,0.25);white-space:nowrap;border:2px solid #8D6E63;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ═══ BACK TO TOP ═══ */
.back-top{
  position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;
  background:#5D4037;border:3px solid #8D6E63;display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,0.35);
  border-bottom:4px solid #3E2723;transition:all 0.2s;text-decoration:none;
}
.back-top:hover{background:#3E2723;}

/* ═══ COLLECTION SECTION ═══ */
.collection-section{display:none;}
.collection-section.active{display:block;}
</style>
</head>
<body>
<div id="app-wrapper">

  <!-- HEADER -->
  <div class="header coding-header" id="codingHeader">
    <span class="float-deco" style="top:10px;left:28%;animation:floatDeco 3s ease-in-out infinite;">📚</span>
    <span class="float-deco" style="top:14px;left:60%;animation:floatDeco 4.5s ease-in-out infinite 1s;">⭐</span>
    <span class="float-deco" style="top:8px;right:6%;animation:floatDeco 3.5s ease-in-out infinite 2s;">🔖</span>
    <div class="header-top">
      <a href="index.html" class="back-btn">← Kembali</a>
      <span class="date-badge" id="dateDisplay">—</span>
    </div>
    <div class="header-hero">
      <div class="library-icon-wrap coding-icon">📚</div>
      <div>
        <div class="header-title">PERPUSTAKAAN<br>ASLAN</div>
        <div class="header-sub">💻 30 Coding · 🇬🇧 30 English · 🔬 30 Sains</div>
      </div>

// ═══ DATE HELPERS ═══
const DAYS_ID   = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const DAYS_LONG = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTHS_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function getTodayBookDay(startDate) {
  if(!startDate) return 1;
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.floor((today - startDate) / (1000*60*60*24));
  return Math.min(Math.max(diff + 1, 1), 30);
}
function isUnlocked(bookDay, startDate) { return bookDay <= getTodayBookDay(startDate); }
function isToday(bookDay, startDate)    { return bookDay === getTodayBookDay(startDate); }
function formatDateShort(d) { return DAYS_ID[d.getDay()]+', '+d.getDate()+' '+MONTHS_ID[d.getMonth()]; }
function formatDateLong(d)  { return d.getDate()+' '+MONTHS_ID[d.getMonth()]+' '+d.getFullYear(); }
function getUnlockDate(bookDay, startDate) {
  const d = new Date(startDate);
  d.setDate(startDate.getDate() + (bookDay - 1));
  return d;
}
function getCodingWeekClass(day)  { if(day<=7) return 'cw1'; if(day<=14) return 'cw2'; if(day<=21) return 'cw3'; if(day<=28) return 'cw4'; return 'cw5'; }
function getEnglishWeekClass(day) { if(day<=7) return 'ew1'; if(day<=14) return 'ew2'; if(day<=21) return 'ew3'; if(day<=28) return 'ew4'; return 'ew5'; }
function getSainsWeekClass(day)   { if(day<=7) return 'sw1'; if(day<=14) return 'sw2'; if(day<=21) return 'sw3'; if(day<=28) return 'sw4'; return 'sw5'; }

// ═══ FIREBASE INIT ═══
function initAll(callback) {
  Promise.all([
    CODING_REF.once('value'),
    ENGLISH_REF.once('value'),
    SAINS_REF.once('value')
  ]).then(([cSnap, eSnap, sSnap]) => {
    const cData = cSnap.val() || {};
    const eData = eSnap.val() || {};
    const sData = sSnap.val() || {};
    if (cData.startDate) { codingStartDate = new Date(cData.startDate); }
    else { codingStartDate = new Date(); codingStartDate.setHours(0,0,0,0); CODING_REF.child('startDate').set(codingStartDate.toISOString()); }
    codingReadBooks  = cData.readBooks || {};
    englishReadBooks = eData.readBooks || {};
    sainsReadBooks   = sData.readBooks || {};
    callback();
  }).catch(() => {
    codingStartDate  = getLocalDate('aslan_library_start');
    codingReadBooks  = getLocalBooks('aslan_library_v1');
    englishReadBooks = getLocalBooks('aslan_english_v1');
    sainsReadBooks   = getLocalBooks('aslan_sains_v1');
    callback();
  });
}

function markCodingRead(day) {
  codingReadBooks[day] = { readAt: Date.now() };
  CODING_REF.child('readBooks/'+day).set({ readAt: Date.now() }).catch(() => saveLocalBooks('aslan_library_v1', codingReadBooks));
  setTimeout(() => { renderAll(); showToast('💻 Buku Coding ke-'+day+' selesai! +XP! 🌟'); }, 300);
}
function markEnglishRead(day) {
  englishReadBooks[day] = { readAt: Date.now() };
  ENGLISH_REF.child('readBooks/'+day).set({ readAt: Date.now() }).catch(() => saveLocalBooks('aslan_english_v1', englishReadBooks));
  setTimeout(() => { renderAll(); showToast('🇬🇧 English Book #'+day+' done! Great job! ⭐'); }, 300);
}
function markSainsRead(day) {
  const no = day + 200;
  sainsReadBooks[day] = { readAt: Date.now() };
  SAINS_REF.child('readBooks/'+day).set({ readAt: Date.now() }).catch(() => saveLocalBooks('aslan_sains_v1', sainsReadBooks));
  setTimeout(() => { renderAll(); showToast('🔬 Buku Sains #'+no+' selesai! Keren Aslan! 🧪'); }, 300);
}

// ═══ LOCALSTORAGE FALLBACK ═══
function getLocalBooks(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch(e) { return {}; } }
function saveLocalBooks(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); } catch(e){} }
function getLocalDate(key) {
  try { const d = localStorage.getItem(key); if(d) return new Date(d); } catch(e){}
  const t = new Date(); t.setHours(0,0,0,0);
  try { localStorage.setItem(key, t.toISOString()); } catch(e){}
  return t;
}

// ═══ TAB SWITCH ═══
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.collection-section').forEach(s => s.classList.remove('active'));
  if(tab === 'coding') {
    document.querySelector('.coding-tab').classList.add('active');
    document.getElementById('codingSection').classList.add('active');
  } else if(tab === 'english') {
    document.querySelector('.english-tab').classList.add('active');
    document.getElementById('englishSection').classList.add('active');
  } else {
    document.querySelector('.sains-tab').classList.add('active');
    document.getElementById('sainsSection').classList.add('active');
  }
}

// ═══ RENDER ═══
function renderDate() {
  const d = new Date();
  document.getElementById('dateDisplay').textContent = DAYS_LONG[d.getDay()]+', '+d.getDate()+' '+MONTHS_ID[d.getMonth()];
}

function renderStats() {
  const cRead = Object.keys(codingReadBooks).length;
  const eRead = Object.keys(englishReadBooks).length;
  const sRead = Object.keys(sainsReadBooks).length;
  const cDay  = getTodayBookDay(codingStartDate);
  const eDay  = getTodayBookDay(ENGLISH_START_DATE);
  const today = new Date(); today.setHours(0,0,0,0);
  const sainsStarted = today >= SAINS_START_DATE;
  const sDay  = sainsStarted ? getTodayBookDay(SAINS_START_DATE) : 0;

  document.getElementById('cStatRead').textContent   = cRead;
  document.getElementById('cStatToday').textContent  = cDay > 30 ? '🏆' : cDay;
  document.getElementById('cStatLocked').textContent = Math.max(0, 30 - cDay);
  document.getElementById('eStatRead').textContent   = eRead;
  document.getElementById('eStatToday').textContent  = eDay > 30 ? '🏆' : eDay;
  document.getElementById('eStatLocked').textContent = Math.max(0, 30 - eDay);
  document.getElementById('sStatRead').textContent   = sRead;
  document.getElementById('sStatToday').textContent  = !sainsStarted ? '📅' : (sDay > 30 ? '🏆' : sDay);
  document.getElementById('sStatLocked').textContent = !sainsStarted ? 30 : Math.max(0, 30 - sDay);

  document.getElementById('codingProgressText').textContent  = cRead + ' / 30';
  document.getElementById('englishProgressText').textContent = eRead + ' / 30';
  document.getElementById('sainsProgressText').textContent   = sRead + ' / 30';
  document.getElementById('codingProgressFill').style.width  = (cRead/30*100)+'%';
  document.getElementById('englishProgressFill').style.width = (eRead/30*100)+'%';
  document.getElementById('sainsProgressFill').style.width   = (sRead/30*100)+'%';
}

function renderMotivations() {
  const cIdx = getTodayBookDay(codingStartDate)    % CODING_MOTIVATIONS.length;
  const eIdx = getTodayBookDay(ENGLISH_START_DATE) % ENGLISH_MOTIVATIONS.length;
  const sIdx = new Date().getDay() % SAINS_MOTIVATIONS.length;
  document.getElementById('codingMotivation').textContent  = CODING_MOTIVATIONS[cIdx];
  document.getElementById('englishMotivation').textContent = ENGLISH_MOTIVATIONS[eIdx];
  document.getElementById('sainsMotivation').textContent   = SAINS_MOTIVATIONS[sIdx];
}

function renderTodayHighlight(books, readBooks, startDate, containerId, type) {
  const container = document.getElementById(containerId);
  const today = new Date(); today.setHours(0,0,0,0);

  // Sains: belum mulai
  if(type === 'sains' && today < SAINS_START_DATE) {
    container.innerHTML = `
      <div class="coming-soon-card">
        <div class="coming-soon-emoji">🔬</div>
        <div class="coming-soon-title">KOLEKSI SAINS &<br>PETUALANGAN</div>
        <div style="color:#A5D6A7;font-size:12px;font-weight:700;margin-bottom:14px;">30 buku seru menunggumu!</div>
        <div class="coming-soon-date">📅 Mulai: 1 Juni 2026</div>
      </div>`;
    return;
  }

  const todayDay = getTodayBookDay(startDate);
  if(todayDay < 1 || todayDay > 30) { container.innerHTML=''; return; }
  const book   = books[todayDay - 1];
  const isRead = !!readBooks[todayDay];

  let wclass, flipNum, label, btnClass, btnText;
  if(type === 'coding') {
    wclass   = getCodingWeekClass(todayDay);
    flipNum  = todayDay;
    label    = 'BUKU CODING HARI INI';
    btnClass = 'coding-btn';
    btnText  = '📖 BACA SEKARANG!';
  } else if(type === 'english') {
    wclass   = getEnglishWeekClass(todayDay);
    flipNum  = 100 + todayDay;
    label    = 'ENGLISH BOOK TODAY';
    btnClass = 'english-btn';
    btnText  = '📖 READ NOW!';
  } else {
    wclass   = getSainsWeekClass(todayDay);
    flipNum  = book.no;
    label    = 'BUKU SAINS HARI INI';
    btnClass = 'sains-btn';
    btnText  = '🔬 BACA SEKARANG!';
  }

  const colorMap = {
    cw1:['#1565C0','#0D47A1'], cw2:['#2E7D32','#1B5E20'], cw3:['#E65100','#BF360C'], cw4:['#6A1B9A','#4A148C'], cw5:['#00695C','#004D40'],
    ew1:['#0D47A1','#01579B'], ew2:['#00695C','#004D40'], ew3:['#4527A0','#311B92'], ew4:['#880E4F','#4A148C'], ew5:['#E65100','#BF360C'],
    sw1:['#00695C','#004D40'], sw2:['#E65100','#BF360C'], sw3:['#C62828','#B71C1C'], sw4:['#283593','#1A237E'], sw5:['#1B5E20','#33691E'],
  };
  const [c1,c2] = colorMap[wclass];
  const markFn = type === 'coding' ? 'markCodingRead' : (type === 'english' ? 'markEnglishRead' : 'markSainsRead');

  container.innerHTML = `
    <div class="today-book-card" style="background:linear-gradient(135deg,${c1},${c2});border-color:${c2};">
      <div class="today-book-badge">📖 ${label} — HARI KE-${todayDay}</div>
      <div style="font-size:36px;margin-bottom:8px;">${book.emoji}</div>
      <div class="today-book-title">${book.title}</div>
      ${isRead
        ? `<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.4);border-radius:20px;padding:6px 16px;font-size:12px;font-weight:800;color:white;">✅ Sudah dibaca! Keren Aslan! 🎉</div>`
        : `<a href="flip/${flipNum}.html" class="today-book-btn ${btnClass}" onclick="${markFn}(${todayDay})">${btnText}</a>`
      }
    </div>`;
}

function renderBooks(books, weekLabels, readBooks, startDate, containerId, type) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);

  // Sains belum mulai — tampilkan coming-soon grid
  if(type === 'sains' && today < SAINS_START_DATE) {
    const days = Math.ceil((SAINS_START_DATE - today) / (1000*60*60*24));
    const infoDiv = document.createElement('div');
    infoDiv.style.cssText = 'text-align:center;padding:30px 20px;';
    infoDiv.innerHTML = `
      <div style="font-size:48px;margin-bottom:12px;">🔬</div>
      <div style="font-family:\'Press Start 2P\',monospace;font-size:9px;color:#1B5E20;line-height:1.8;margin-bottom:10px;">30 BUKU SAINS<br>MENUNGGUMU!</div>
      <div style="font-size:13px;font-weight:700;color:#558B2F;">Koleksi terbuka dalam <strong>${days}</strong> hari lagi</div>
      <div style="font-size:12px;color:#8BC34A;margin-top:6px;font-weight:700;">📅 1 Juni 2026</div>`;
    container.appendChild(infoDiv);

    // Pratinjau judul-judul buku (terkunci semua)
    weekLabels.forEach(wk => {
      const startDay = (wk.week-1)*7 + 1;
      const endDay   = Math.min(wk.week*7, 30);
      const booksInWeek = books.filter(b => b.day >= startDay && b.day <= endDay);

      const weekTitle = document.createElement('div');
      weekTitle.className = 'week-title sains';
      weekTitle.innerHTML = `<span class="week-title-emoji">${wk.emoji}</span><span>${wk.label}: ${wk.sub}</span>`;
      container.appendChild(weekTitle);

      const grid = document.createElement('div');
      grid.className = 'books-grid';
      booksInWeek.forEach(book => {
        const wclass = getSainsWeekClass(book.day);
        const card = document.createElement('div');
        card.className = `book-card ${wclass} locked`;
        card.addEventListener('click', () => showToast('📅 Terbuka 1 Juni 2026! Sabar ya! 😊'));
        card.innerHTML = `
          <div class="book-spine spine-${wclass}"></div>
          <div class="book-cover">
            <div class="book-cover-top">
              <div class="book-emoji">📕</div>
              <div class="book-num-badge num-${wclass}">#${book.no}</div>
            </div>
            <div class="book-title" style="color:#90A4AE;">${book.title}</div>
            <div class="book-footer"><span class="book-status status-locked">🔒 1 Jun 2026</span><span class="book-day">Hari ${book.day}</span></div>
          </div>
          <div class="book-lock-overlay"><div class="lock-icon">🔒</div><div class="lock-text">1 Jun 2026</div></div>`;
        grid.appendChild(card);
      });
      container.appendChild(grid);
      if(wk.week < 5) {
        const shelf = document.createElement('div');
        shelf.className = 'shelf-deco sains';
        container.appendChild(shelf);
      }
    });
    return;
  }

  // Normal render
  weekLabels.forEach(wk => {
    const startDay = (wk.week-1)*7 + 1;
    const endDay   = Math.min(wk.week*7, 30);
    const booksInWeek = books.filter(b => b.day >= startDay && b.day <= endDay);

    const weekTitle = document.createElement('div');
    weekTitle.className = 'week-title' + (type === 'coding' ? '' : (type === 'english' ? ' english' : ' sains'));
    weekTitle.innerHTML = `<span class="week-title-emoji">${wk.emoji}</span><span>${wk.label}: ${wk.sub}</span>`;
    container.appendChild(weekTitle);

    const grid = document.createElement('div');
    grid.className = 'books-grid';

    booksInWeek.forEach(book => {
      const unlocked    = isUnlocked(book.day, startDate);
      const bookIsToday = isToday(book.day, startDate);
      const isRead      = !!readBooks[book.day];
      const wclass      = type === 'coding' ? getCodingWeekClass(book.day) : (type === 'english' ? getEnglishWeekClass(book.day) : getSainsWeekClass(book.day));
      const unlockDate  = getUnlockDate(book.day, startDate);
      const flipNum     = type === 'coding' ? book.day : (type === 'english' ? (100 + book.day) : book.no);
      const displayNum  = type === 'sains' ? book.no : book.day;

      const card = document.createElement('div');
      let cardClass = `book-card ${wclass}`;
      if(bookIsToday) cardClass += ' today-book-card-item';
      if(isRead)      cardClass += ' read';
      if(!unlocked)   cardClass += ' locked';
      card.className = cardClass;

      if(unlocked && !isRead) {
        card.addEventListener('click', () => {
          if(type==='coding') markCodingRead(book.day);
          else if(type==='english') markEnglishRead(book.day);
          else markSainsRead(book.day);
          window.location.href = 'flip/'+flipNum+'.html';
        });
      } else if(isRead) {
        card.addEventListener('click', () => { window.location.href = 'flip/'+flipNum+'.html'; });
      } else {
        card.addEventListener('click', () => { showToast('🔒 Terbuka '+formatDateShort(unlockDate)+'! Sabar ya! 😊'); });
      }

      let statusClass, todayLabel, baca;
      if(type === 'coding')       { statusClass='status-today';      todayLabel='📖 Hari Ini!'; baca='📚 Baca!'; }
      else if(type === 'english') { statusClass='status-today-en';   todayLabel='📖 Today!';    baca='📖 Read!'; }
      else                        { statusClass='status-today-sains'; todayLabel='🔬 Hari Ini!'; baca='🔬 Baca!'; }

      let statusHtml = '';
      if(bookIsToday)   statusHtml = `<span class="book-status ${statusClass}">${todayLabel}</span>`;
      else if(isRead)   statusHtml = `<span class="book-status status-read">✅ Selesai!</span>`;
      else if(unlocked) statusHtml = `<span class="book-status ${statusClass}">${baca}</span>`;
      else              statusHtml = `<span class="book-status status-locked">🔒 ${formatDateShort(unlockDate)}</span>`;

      card.innerHTML = `
        <div class="book-spine spine-${wclass}"></div>
        ${isRead ? '<div class="read-check">✓</div>' : ''}
        <div class="book-cover">
          <div class="book-cover-top">
            <div class="book-emoji">${(unlocked || type==='english') ? book.emoji : '📕'}</div>
            <div class="book-num-badge num-${wclass}">#${displayNum}</div>
          </div>
          <div class="book-title">${(unlocked || type==='english') ? book.title : 'Buku Tersembunyi...'}</div>
          <div class="book-footer">${statusHtml}<span class="book-day">Hari ${book.day}</span></div>
        </div>
        ${!unlocked ? `<div class="book-lock-overlay"><div class="lock-icon">🔒</div><div class="lock-text">${formatDateShort(unlockDate)}</div></div>` : ''}`;
      grid.appendChild(card);
    });

    container.appendChild(grid);
    if(wk.week < 5) {
      const shelf = document.createElement('div');
      shelf.className = 'shelf-deco ' + (type === 'coding' ? 'coding' : (type === 'english' ? 'english' : 'sains'));
      container.appendChild(shelf);
    }
  });
}

function renderAll() {
  renderDate();
  renderStats();
  renderMotivations();
  renderTodayHighlight(CODING_BOOKS,  codingReadBooks,  codingStartDate,    'codingTodayHighlight',  'coding');
  renderTodayHighlight(ENGLISH_BOOKS, englishReadBooks, ENGLISH_START_DATE, 'englishTodayHighlight', 'english');
  renderTodayHighlight(SAINS_BOOKS,   sainsReadBooks,   SAINS_START_DATE,   'sainsTodayHighlight',   'sains');
  renderBooks(CODING_BOOKS,  CODING_WEEK_LABELS,  codingReadBooks,  codingStartDate,    'codingBooksContainer',  'coding');
  renderBooks(ENGLISH_BOOKS, ENGLISH_WEEK_LABELS, englishReadBooks, ENGLISH_START_DATE, 'englishBooksContainer', 'english');
  renderBooks(SAINS_BOOKS,   SAINS_WEEK_LABELS,   sainsReadBooks,   SAINS_START_DATE,   'sainsBooksContainer',   'sains');
}

// ═══ TOAST ═══
let toastTimeout;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
}

// ═══ INIT ═══
document.getElementById('codingBooksContainer').innerHTML  = '<div style="text-align:center;padding:40px;color:#8D6E63;font-weight:700;">⏳ Memuat perpustakaan...</div>';
document.getElementById('englishBooksContainer').innerHTML = '<div style="text-align:center;padding:40px;color:#5C6BC0;font-weight:700;">⏳ Loading English books...</div>';
document.getElementById('sainsBooksContainer').innerHTML   = '<div style="text-align:center;padding:40px;color:#388E3C;font-weight:700;">⏳ Memuat buku Sains...</div>';
initAll(() => { renderAll(); });
</script>
