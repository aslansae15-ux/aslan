.lib-today {

}
.lib-today::after { content: '📖'; position: absolute; right: 16px; bottom: -10px; font-size: 80px; opacity: .14; transform: rotate(-10deg); }
.lib-today-badge { display: inline-flex; padding: 5px 12px; border-radius: var(--r-full); background: rgba(255, 255, 255, .2); font-size: 12px; font-weight: 800; }
.lib-today-emoji { margin-top: 14px; font-size: 40px; line-height: 1; }
.lib-today-title { position: relative; margin-top: 10px; font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.3; }
.lib-today-btn {
  position: relative; margin-top: 16px; min-height: 46px; padding: 0 22px;

.lib-today-btn:active { transform: scale(.97); }
.lib-today-done { position: relative; display: inline-flex; margin-top: 16px; padding: 8px 14px; border-radius: var(--r-full); background: rgba(255, 255, 255, .2); font-size: 13px; font-weight: 800; }
.lib-note { padding: 18px; text-align: center; border-radius: var(--r-lg); background: var(--surface); border: 1px dashed var(--line-strong); }
.lib-note-emoji { font-size: 40px; line-height: 1; }
.lib-note-title { margin-top: 8px; font-size: 16px; font-weight: 800; }
.lib-note-sub { margin-top: 4px; font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.lib-note .chip { margin-top: 12px; }

.lib-quote { position: relative; padding: 14px 16px 14px 46px; border-radius: var(--r-md); background: var(--surface-2); font-size: 14px; font-weight: 600; font-style: italic; line-height: 1.55; color: var(--ink-2); }
.lib-quote::before { content: '“'; position: absolute; left: 14px; top: 4px; font-family: var(--font-display); font-size: 44px; line-height: 1; color: var(--c1); }

.book-card {

.book-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; }

.status-today { background: var(--gold-soft); color: var(--gold-ink); }
.status-read { background: var(--brand-50); color: var(--brand-700); }
.status-locked { background: var(--surface-3); color: var(--ink-3); }
.book-day { font-size: 11px; font-weight: 700; color: var(--ink-4); white-space: nowrap; }
.book-check {
  position: absolute; top: 12px; right: 12px;
  width: 24px; height: 24px; display: grid; place-items: center;
  border-radius: 50%; background: var(--brand-500); color: #fff; font-size: 13px; font-weight: 900;

.book-card.read .book-num { visibility: hidden; }

.book-card.locked { background: var(--surface-2); box-shadow: none; }

.book-card.locked .book-emoji { filter: grayscale(1); opacity: .5; }
.book-card.locked .book-title { color: var(--ink-4); }

.fab-top {
  position: fixed; right: 16px; bottom: calc(84px + var(--safe-b)); z-index: 60;

// ═══ START DATES ═══
const ENGLISH_START_DATE   = new Date('2026-05-17T00:00:00');
const SAINS_START_DATE     = new Date('2026-06-02T00:00:00');
const ADVENTURE_START_DATE = new Date('2026-06-16T00:00:00');
const DIGITAL_START_DATE   = new Date('2026-07-01T00:00:00');
const HARDWARE_START_DATE  = new Date('2026-06-01T00:00:00');
const AI_START_DATE        = new Date('2026-06-01T00:00:00');
const EVOLUSI_START_DATE   = new Date('2026-07-01T00:00:00');


// ═══ KOLEKSI ═══
// flip(): nomor file di folder flip/ untuk tiap buku (pemetaan lama dipertahankan persis).
const COLLECTIONS = [
  {type:'coding',    name:'Coding',         emoji:'💻', books:CODING_BOOKS,    weeks:CODING_WEEK_LABELS,    motivations:CODING_MOTIVATIONS,    ref:CODING_REF,    lsKey:'aslan_library_v2',   start:()=>codingStartDate,     c1:'#F08A24', c2:'#B4580A', flip:b=>b.day,     cta:'📖 Baca sekarang'},
  {type:'english',   name:'English',        emoji:'🔤', books:ENGLISH_BOOKS,   weeks:ENGLISH_WEEK_LABELS,   motivations:ENGLISH_MOTIVATIONS,   ref:ENGLISH_REF,   lsKey:'aslan_english_v1',   start:()=>ENGLISH_START_DATE,  c1:'#3A7BF0', c2:'#1D4FC4', flip:b=>100+b.day, cta:'📖 Read now'},
  {type:'sains',     name:'Sains',          emoji:'🔬', books:SAINS_BOOKS,     weeks:SAINS_WEEK_LABELS,     motivations:SAINS_MOTIVATIONS,     ref:SAINS_REF,     lsKey:'aslan_sains_v1',     start:()=>SAINS_START_DATE,    c1:'#1FAF66', c2:'#08713D', flip:b=>b.no,      cta:'🔬 Baca sekarang', hideComingSoon:true},
  {type:'adventure', name:'Adventure',      emoji:'✨', books:ADVENTURE_BOOKS, weeks:ADVENTURE_WEEK_LABELS, motivations:ADVENTURE_MOTIVATIONS, ref:ADVENTURE_REF, lsKey:'aslan_adventure_v1', start:()=>ADVENTURE_START_DATE,c1:'#8B6CFA', c2:'#4B2BC2', flip:b=>130+b.day, cta:'✨ Read now'},
  {type:'digital',   name:'Lautan Digital', emoji:'🌊', books:DIGITAL_BOOKS,   weeks:DIGITAL_WEEK_LABELS,   motivations:DIGITAL_MOTIVATIONS,   ref:DIGITAL_REF,   lsKey:'aslan_digital_v1',   start:()=>DIGITAL_START_DATE,  c1:'#16B3AE', c2:'#0A6662', flip:b=>300+b.day, cta:'🌊 Baca sekarang'},
  {type:'hardware',  name:'Hardware',       emoji:'🖥️', books:HARDWARE_BOOKS,  weeks:HARDWARE_WEEK_LABELS,  motivations:HARDWARE_MOTIVATIONS,  ref:HARDWARE_REF,  lsKey:'aslan_hardware_v1',  start:()=>HARDWARE_START_DATE, c1:'#5B67E0', c2:'#2E3796', flip:b=>30+b.day,  cta:'🖥️ Baca sekarang'},
  {type:'ai',        name:'AI',             emoji:'🤖', books:AI_BOOKS,        weeks:AI_WEEK_LABELS,        motivations:AI_MOTIVATIONS,        ref:AI_REF,        lsKey:'aslan_ai_v1',        start:()=>AI_START_DATE,       c1:'#12A3C7', c2:'#0E5F75', flip:b=>60+b.day,  cta:'🤖 Baca sekarang'},
  {type:'evolusi',   name:'Evolusi',        emoji:'🦴', books:EVOLUSI_BOOKS,   weeks:EVOLUSI_WEEK_LABELS,   motivations:EVOLUSI_MOTIVATIONS,   ref:EVOLUSI_REF,   lsKey:'aslan_evolusi_v1',   start:()=>EVOLUSI_START_DATE,  c1:'#B8743A', c2:'#6B3A12', flip:b=>230+b.day, cta:'🦴 Baca sekarang'},
];
const WEEK_TONES = ['sky','brand','orange','violet','teal'];
const byType = t => COLLECTIONS.find(c => c.type === t);

// ═══ STATE ═══
const READ = {};
COLLECTIONS.forEach(c => { READ[c.type] = {}; });
let codingStartDate = null;
let activeType = 'coding';

// ═══ TANGGAL ═══
const DAYS_ID   = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const DAYS_LONG = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTHS_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTHS_LONG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function dayIndex(startDate) {
  if(!startDate) return 1;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.floor((today - startDate) / 86400000) + 1;
}
function getTodayBookDay(startDate) { return Math.min(Math.max(dayIndex(startDate), 1), 30); }
function hasStarted(startDate) { const t = new Date(); t.setHours(0,0,0,0); return t >= startDate; }
function isFinished(startDate) { return dayIndex(startDate) > 30; }
function getUnlockDate(bookDay, startDate) { const d = new Date(startDate); d.setDate(startDate.getDate() + (bookDay - 1)); return d; }
function formatDateShort(d) { return DAYS_ID[d.getDay()]+', '+d.getDate()+' '+MONTHS_ID[d.getMonth()]; }
function formatDateLong(d) { return d.getDate()+' '+MONTHS_LONG[d.getMonth()]+' '+d.getFullYear(); }
// Minggu terakhir menampung sisa hari (misalnya AI: minggu ke-4 = hari 22–30).
function weekOf(day, c) { return Math.min(Math.ceil(day / 7), c.weeks.length); }
function toneOf(day, c) { return WEEK_TONES[(weekOf(day, c) - 1) % WEEK_TONES.length]; }

// ═══ FIREBASE ═══
function initAll(callback) {
  Promise.all(COLLECTIONS.map(c => c.ref.once('value'))).then(snaps => {
    snaps.forEach((snap, i) => {
      const c = COLLECTIONS[i];
      const d = snap.val() || {};
      READ[c.type] = d.readBooks || {};
      if(c.type === 'coding') {
        if(d.startDate) codingStartDate = new Date(d.startDate);
        else { codingStartDate = new Date(); codingStartDate.setHours(0,0,0,0); CODING_REF.child('startDate').set(codingStartDate.toISOString()); }
      }
    });
    callback();
  }).catch(() => {
    codingStartDate = getLocalDate('aslan_library_start');
    COLLECTIONS.forEach(c => { READ[c.type] = getLocalBooks(c.lsKey); });
    callback();
  });
}
function getLocalBooks(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch(e) { return {}; } }
function getLocalDate(key) {
  try { const d = localStorage.getItem(key); if(d) return new Date(d); } catch(e){}
  const t = new Date(); t.setHours(0,0,0,0);
  try { localStorage.setItem(key, t.toISOString()); } catch(e){}
  return t;
}

// ═══ BUKA BUKU ═══
function openBook(type, day) {
  const c = byType(type);
  const url = 'flip/' + c.flip(c.books[day-1]) + '.html';
  if(READ[type][day]) { location.href = url; return; }
  READ[type][day] = { readAt: Date.now() };
  try { localStorage.setItem(c.lsKey, JSON.stringify(READ[type])); } catch(e){}
  showToast(c.emoji+' Selamat membaca buku #'+c.flip(c.books[day-1])+'! 🌟');
  // Tunggu simpan ke Firebase (maks. 1,2 detik) supaya tanda "sudah dibaca" tidak hilang saat pindah halaman.
  const write = c.ref.child('readBooks/'+day).set({ readAt: Date.now() }).catch(() => {});
  Promise.race([write, new Promise(r => setTimeout(r, 1200))]).then(() => { location.href = url; });
}
function onBookClick(type, day) {
  const c = byType(type); const start = c.start();
  if(!hasStarted(start)) { showToast('📅 Koleksi ini mulai '+formatDateLong(start)+'. Sabar ya! 😊'); return; }
  if(day > getTodayBookDay(start)) { showToast('🔒 Terbuka '+formatDateShort(getUnlockDate(day, start))+'. Sabar ya! 😊'); return; }
  openBook(type, day);
}

// ═══ TAMPILAN ═══
function readCount(type) { return Object.keys(READ[type]).length; }

function renderDate() {
  const d = new Date();
  document.getElementById('dateDisplay').textContent = DAYS_LONG[d.getDay()]+', '+d.getDate()+' '+MONTHS_LONG[d.getMonth()];
}
function renderOverview() {
  const total = COLLECTIONS.reduce((s, c) => s + readCount(c.type), 0);
  const max = COLLECTIONS.length * 30;
  document.getElementById('totalRead').textContent = total;
  document.getElementById('totalBooks').textContent = max;
  document.getElementById('totalFill').style.width = (total / max * 100) + '%';
}
function renderTabs() {
  document.getElementById('tabsContainer').innerHTML = COLLECTIONS.map(c =>
    `<button class="choice${c.type===activeType?' active':''}" onclick="switchTab('${c.type}')">${c.emoji} ${c.name}<span class="lib-tab-count">${readCount(c.type)}/30</span></button>`
  ).join('');
}
function switchTab(type) {
  activeType = type;
  renderTabs();
  renderCollection();
  const el = document.querySelector('#tabsContainer .choice.active');
  if(el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}

function todayCard(c, started, finished, todayDay) {
  const start = c.start();
  if(!started) {
    if(c.hideComingSoon) return '';
    return `<div class="lib-note"><div class="lib-note-emoji">${c.emoji}</div><div class="lib-note-title">Koleksi ${c.name} segera hadir</div><div class="lib-note-sub">30 buku seru menunggumu!</div><span class="chip chip-gold">📅 Mulai ${formatDateLong(start)}</span></div>`;
  }
  if(finished) {
    const left = 30 - readCount(c.type);
    return `<div class="lib-note"><div class="lib-note-emoji">🏆</div><div class="lib-note-title">Semua 30 buku sudah terbuka!</div><div class="lib-note-sub">${left>0?'Masih ada '+left+' buku yang belum kamu baca. Ayo selesaikan!':'Kamu sudah membaca semuanya. Hebat, Aslan!'}</div></div>`;
  }
  const book = c.books[todayDay-1];
  const done = !!READ[c.type][todayDay];
  return `<div class="lib-today">
    <div class="lib-today-badge">📖 Buku hari ini · Hari ke-${todayDay}</div>
    <div class="lib-today-emoji">${book.emoji}</div>
    <div class="lib-today-title">${book.title}</div>
    ${done ? `<div class="lib-today-done">✅ Sudah dibaca. Keren, Aslan! 🎉</div>` : `<button class="lib-today-btn" onclick="openBook('${c.type}',${todayDay})">${c.cta}</button>`}
  </div>`;
}

function bookCard(c, book, started, finished, todayDay) {
  const unlocked = started && book.day <= todayDay;
  const isTodayBook = started && !finished && book.day === todayDay;
  const done = !!READ[c.type][book.day];
  const start = c.start();
  let status;
  if(!unlocked) status = `<span class="book-status status-locked">🔒 ${started ? formatDateShort(getUnlockDate(book.day, start)) : 'Belum mulai'}</span>`;
  else if(isTodayBook && !done) status = `<span class="book-status status-today">⭐ Hari ini</span>`;
  else if(done) status = `<span class="book-status status-read">✓ Selesai</span>`;
  else status = `<span class="book-status status-open">Baca</span>`;
  const cls = ['book-card', 'tone-'+toneOf(book.day, c)];
  if(done) cls.push('read');
  if(!unlocked) cls.push('locked');
  if(isTodayBook) cls.push('today');
  return `<button type="button" class="${cls.join(' ')}" onclick="onBookClick('${c.type}',${book.day})">
    <span class="book-band"></span>
    ${done ? '<span class="book-check">✓</span>' : ''}
    <span class="book-top"><span class="book-emoji">${unlocked ? book.emoji : '📕'}</span><span class="book-num">#${c.flip(book)}</span></span>
    <span class="book-title">${unlocked ? book.title : 'Buku rahasia...'}</span>
    <span class="book-foot">${status}<span class="book-day">Hari ${book.day}</span></span>
  </button>`;
}

function renderCollection() {
  const c = byType(activeType);
  const start = c.start();
  const started = hasStarted(start);
  const finished = started && isFinished(start);
  const todayDay = started ? getTodayBookDay(start) : 0;
  const rc = readCount(c.type);
  const unlockedCount = !started ? 0 : todayDay;
  const motivation = c.motivations[new Date().getDay() % c.motivations.length].replace(/^"|"$/g, '');

  let html = `<section class="lib-view" style="--c1:${c.c1};--c2:${c.c2};">
    <div class="lib-top">
    <div class="card lib-head">
      <div class="lib-head-icon">${c.emoji}</div>
      <div class="lib-head-text">
        <div class="lib-head-title">${c.name}</div>
        <div class="lib-head-sub">${rc} dari 30 buku dibaca</div>
        <div class="progress"><div class="progress-fill" style="width:${rc/30*100}%"></div></div>
      </div>
    </div>
    <div class="lib-stats">
      <div class="lib-stat"><div class="lib-stat-num">${rc}</div><div class="lib-stat-label">✅ Dibaca</div></div>
      <div class="lib-stat"><div class="lib-stat-num">${!started ? '📅' : finished ? '🏆' : todayDay}</div><div class="lib-stat-label">🌟 Buku hari ini</div></div>
      <div class="lib-stat"><div class="lib-stat-num">${30 - unlockedCount}</div><div class="lib-stat-label">🔒 Terkunci</div></div>
    </div>
    </div>
    ${todayCard(c, started, finished, todayDay)}
    <div class="lib-quote">${motivation}</div>`;

  c.weeks.forEach(wk => {
    const books = c.books.filter(b => weekOf(b.day, c) === wk.week);
    const tone = WEEK_TONES[(wk.week - 1) % WEEK_TONES.length];
    html += `<div class="week-head tone-${tone}">
      <div class="week-emoji">${wk.emoji}</div>
      <div><div class="week-label">${wk.label}</div><div class="week-sub">${wk.sub}</div></div>
    </div>
    <div class="books-grid">${books.map(b => bookCard(c, b, started, finished, todayDay)).join('')}</div>`;
  });
  html += '</section>';
  document.getElementById('collectionView').innerHTML = html;
}

function renderAll() {
  renderDate();
  renderOverview();
  renderTabs();
  renderCollection();
}

// ═══ TOAST ═══
let toastTimeout;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
}

window.addEventListener('scroll', () => {
  document.getElementById('fabTop').classList.toggle('show', window.scrollY > 600);
}, { passive: true });

// ═══ MULAI ═══
renderDate();
initAll(renderAll);
</script>
