<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tank Baja Aslan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace;}
canvas{display:block;position:fixed;top:0;left:0;}

/* ===== TOMBOL HOME (MERAH) — GANTI href DI BAWAH ===== */
#homeBtn{
  position:fixed;top:10px;right:10px;
  width:46px;height:46px;border-radius:50%;
  background:#cc0000;border:3px solid #ff6666;
  color:#fff;font-size:22px;font-weight:bold;
  cursor:pointer;z-index:50;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(255,0,0,0.7);
  text-decoration:none;
}
#homeBtn:hover{background:#ee2222;}

#controls{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:10px 14px 16px;pointer-events:none;z-index:10;
}
.move-group{display:flex;gap:10px;align-items:center;}
.mid-group{display:flex;flex-direction:column;align-items:center;gap:6px;}

.btn{pointer-events:all;border:none;border-radius:50%;cursor:pointer;
  user-select:none;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;flex-direction:column;outline:none;}
.move-btn{
  width:68px;height:68px;font-size:26px;color:#fff;
  background:radial-gradient(circle at 35% 35%,#66ccff,#114488);
  box-shadow:0 0 16px rgba(0,150,255,0.5),0 4px 0 #012;
}
.move-btn:active{transform:scale(0.87);}

#weaponBtn{
  pointer-events:all;cursor:pointer;outline:none;
  -webkit-tap-highlight-color:transparent;
  background:rgba(20,20,70,0.92);border:2px solid #8888ff;
  border-radius:14px;color:#fff;font-size:11px;font-weight:bold;
  padding:7px 14px;white-space:nowrap;font-family:monospace;
  box-shadow:0 0 12px rgba(100,100,255,0.45);
}
#weaponBtn:active{transform:scale(0.9);}

#fireBtn{
  width:90px;height:90px;font-size:12px;font-weight:bold;
  color:#fff;line-height:1.7;
  background:radial-gradient(circle at 35% 35%,#ff9955,#aa2200);
  box-shadow:0 0 25px rgba(255,100,0,0.5),0 4px 0 #600;
  animation:pulseBtn 1.2s ease-in-out infinite;
}
#fireBtn:active{animation:none;transform:scale(0.87);}
@keyframes pulseBtn{
  0%,100%{box-shadow:0 0 20px rgba(255,100,0,0.5),0 4px 0 #600;}
  50%    {box-shadow:0 0 42px rgba(255,150,0,0.85),0 4px 0 #600;}
}

#lvlBanner{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:monospace;font-size:36px;font-weight:bold;
  color:#ffe600;text-shadow:0 0 30px #ffaa00,3px 3px 0 #000;
  pointer-events:none;z-index:20;opacity:0;
  transition:opacity 0.4s;text-align:center;white-space:nowrap;
}
#lvlBanner.show{opacity:1;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- ===== GANTI href DI SINI UNTUK TOMBOL HOME MERAH ===== -->
<a id="homeBtn" href="index.html" title="Kembali">&#10005;</a>

<div id="controls">
  <div class="move-group">
    <button class="btn move-btn" id="leftBtn">&#9664;</button>
    <button class="btn move-btn" id="rightBtn">&#9654;</button>
  </div>
  <div class="mid-group">
    <button id="weaponBtn">&#9733; BIASA (W)</button>
  </div>
  <button class="btn" id="fireBtn">&#128293;<br>TEMBAK<br>&#128293;</button>
</div>
<div id="lvlBanner"></div>

<script>
/* ============================================================
   TANK BAJA ASLAN  —  Full Game v3
   ============================================================ */

var C   = document.getElementById('c');
var ctx = C.getContext('2d');
function resize(){ C.width=window.innerWidth; C.height=window.innerHeight; }
resize(); window.addEventListener('resize',resize);

/* ── roundRect polyfill ─────────────────────────────────── */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='object') r=r[0]||0;
    r=Math.min(r,w/2,h/2);
    this.beginPath();
    this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y);
    this.closePath(); return this;
  };
}

/* ── helpers ─────────────────────────────────────────────── */
function rnd(a,b){ return a+Math.random()*(b-a); }
function GY(){ return C.height*0.85; }
function doShake(m){ if(m>shakeMag) shakeMag=m; }

/* ── audio ───────────────────────────────────────────────── */
var AC=null;
function getAC(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function sndShoot(){try{var a=getAC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(800,a.currentTime);o.frequency.exponentialRampToValueAtTime(150,a.currentTime+0.12);g.gain.setValueAtTime(0.18,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.12);o.start();o.stop(a.currentTime+0.12);}catch(e){}}
function sndLaser(){try{var a=getAC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(2000,a.currentTime);o.frequency.exponentialRampToValueAtTime(300,a.currentTime+0.3);g.gain.setValueAtTime(0.3,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3);o.start();o.stop(a.currentTime+0.3);}catch(e){}}
function sndBoom(big){try{var a=getAC(),n=a.sampleRate*0.35,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);var s=a.createBufferSource();s.buffer=buf;var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=big?500:280;var g=a.createGain();s.connect(f);f.connect(g);g.connect(a.destination);g.gain.setValueAtTime(big?0.6:0.35,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3);s.start();}catch(e){}}
function sndHit(){try{var a=getAC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sawtooth';o.frequency.setValueAtTime(110,a.currentTime);o.frequency.exponentialRampToValueAtTime(40,a.currentTime+0.35);g.gain.setValueAtTime(0.4,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.35);o.start();o.stop(a.currentTime+0.35);}catch(e){}}
function sndPowerup(){try{var a=getAC();[400,600,800,1000].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;var t=a.currentTime+i*0.07;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.14,t+0.04);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.start(t);o.stop(t+0.2);});}catch(e){}}
function sndVictory(){try{var a=getAC();[523,659,784,1047,1319].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;var t=a.currentTime+i*0.22;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.28,t+0.1);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);o.start(t);o.stop(t+0.6);});}catch(e){}}
function sndLevelUp(){try{var a=getAC();[440,550,660].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;var t=a.currentTime+i*0.12;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.2,t+0.05);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.start(t);o.stop(t+0.3);});}catch(e){}}

/* ── input ───────────────────────────────────────────────── */
var keys={left:false,right:false,fire:false};
function bindBtn(id,k){
  var el=document.getElementById(id);
  el.addEventListener('touchstart',function(e){e.preventDefault();keys[k]=true;},{passive:false});
  el.addEventListener('touchend',function(e){e.preventDefault();keys[k]=false;},{passive:false});
  el.addEventListener('mousedown',function(){keys[k]=true;});
  el.addEventListener('mouseup',function(){keys[k]=false;});
  el.addEventListener('mouseleave',function(){keys[k]=false;});
}
bindBtn('leftBtn','left'); bindBtn('rightBtn','right'); bindBtn('fireBtn','fire');
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=true;
  if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();keys.fire=true;}
  if(e.key==='w'||e.key==='W') cycleWeapon();
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
  if(e.key===' '||e.key==='ArrowUp') keys.fire=false;
});

/* ── constants ───────────────────────────────────────────── */
var CHARS=[
  {name:'KAKEK', color:'#aaaaaa',dark:'#666666',hpM:3,spdM:0.85,bFreq:0.8},
  {name:'ENIN',  color:'#dd55ee',dark:'#882299',hpM:2,spdM:1.05,bFreq:1.0},
  {name:'AYAH',  color:'#3366ee',dark:'#1133aa',hpM:2,spdM:1.45,bFreq:0.9},
  {name:'BUNDA', color:'#ee3388',dark:'#991155',hpM:1,spdM:1.2, bFreq:1.5},
  {name:'ALANA', color:'#ffaa22',dark:'#cc5500',hpM:1,spdM:1.75,bFreq:0.7},
];

var WEAPONS=[
  {id:'single',name:'\u2605 BIASA',  unlockLv:1, cd:22,desc:'1 peluru lurus'},
  {id:'double',name:'\u26A1 DOUBLE', unlockLv:2, cd:18,desc:'2 peluru sejajar'},
  {id:'spread',name:'\uD83D\uDD25 SEBAR',  unlockLv:4, cd:20,desc:'3 peluru menyebar'},
  {id:'quad',  name:'\uD83D\uDCA5 QUAD-4', unlockLv:6, cd:26,desc:'4 peluru kipas'},
  {id:'laser', name:'\uD83D\uDD34 LASER',  unlockLv:8, cd:0, desc:'Laser seketika!'},
];

var TIER=[
  {lbl:'ASLAN',         body:'#5d9e61',dark:'#2d5030',trk:'#2a2a2a',acc:'#88ff88', bar:1},
  {lbl:'ASLAN\u272A',   body:'#3a7d40',dark:'#1e3a20',trk:'#333',   acc:'#aaffaa', bar:1},
  {lbl:'ASLAN DESERT',  body:'#c8a050',dark:'#7a5820',trk:'#5a4020',acc:'#ffdd88', bar:2},
  {lbl:'ASLAN ICE',     body:'#88aacc',dark:'#3355aa',trk:'#aaccee',acc:'#ccffff', bar:2},
  {lbl:'ASLAN NIGHT',   body:'#22224a',dark:'#111122',trk:'#333355',acc:'#ffff44', bar:2},
  {lbl:'ASLAN STEEL',   body:'#778899',dark:'#334455',trk:'#445566',acc:'#ccddee', bar:2},
  {lbl:'ASLAN FURY',    body:'#aa2222',dark:'#661111',trk:'#441111',acc:'#ffaa44', bar:3},
  {lbl:'ASLAN THUNDER', body:'#6622aa',dark:'#331166',trk:'#220055',acc:'#cc88ff', bar:3},
  {lbl:'ASLAN GOLD',    body:'#ddaa22',dark:'#996611',trk:'#7a5500',acc:'#ffee88', bar:3},
  {lbl:'ASLAN ULTRA',   body:'#ff6600',dark:'#cc3300',trk:'#993300',acc:'#ffffff', bar:3},
];

var LVLMSG=[
  'Semangat Aslan!!',
  'Aslan Hebat!!',
  'Aslan Keren!!',
  'Lanjutkan, Aslan Juara!',
  'Ayah Bunda Bangga!!',
  'Aslan Pemberani!!',
  'Aslan Super Keren!!',
  'Luar Biasa Aslan!!',
  'Hampir Sampai Aslan!!',
  'Sedikit Lagi Menang!!',
  'Aslan Sang Pahlawan!!',
  'Tak Terhentikan!!',
  'Aslan Bintangku!!',
  'Kebanggaan Keluarga!!',
  'Aslan Jawara!!',
  'Mantap Sekali Aslan!!',
  'Terus Semangat Aslan!!',
  'Aslan Memang Terbaik!!',
  'Juara Sejati Aslan!!',
];

/* ── game state ──────────────────────────────────────────── */
var STATE='start';
var score=0,lives=3,maxLives=5,level=1;
var shakeMag=0,shakeX=0,shakeY=0;
var fireTimer=0,planeTimer=0,planeInterval=150;
var levelTimer=0,combo=0,comboTimer=0;
var rapidFire=0,shield=0;
var laserTimer=0,laserCD=0;
var doubleShot=0,cloneTimer=0;
var titleAnim=0,victoryTimer=0;
var wIdx=0;
var inputDelay=0;

var bullets=[],planes=[],bombs=[],particles=[],pops=[],powerups=[];
var confetti=[],messenger=null;
var tank={x:400,spd:5.5,inv:0,flash:0};

/* stars & clouds */
var stars=[];
for(var i=0;i<130;i++) stars.push({x:rnd(0,3000),y:rnd(0,700),r:rnd(0.3,2.1),tw:rnd(0,6.28)});
var clouds=[];
for(var i=0;i<6;i++) clouds.push({x:rnd(0,2000),y:rnd(60,230),spd:rnd(0.25,0.65),sz:rnd(55,120),al:rnd(0.12,0.22)});

/* ── weapon helpers ──────────────────────────────────────── */
function getAvailWeapons(){
  return WEAPONS.filter(function(w){return level>=w.unlockLv;});
}
function curWeapon(){
  var av=getAvailWeapons();
  if(wIdx>=av.length) wIdx=av.length-1;
  return av[wIdx]||WEAPONS[0];
}
function cycleWeapon(){
  var av=getAvailWeapons();
  wIdx=(wIdx+1)%av.length;
  updateWBtn();
}
function updateWBtn(){
  var el=document.getElementById('weaponBtn');
  if(el) el.textContent=curWeapon().name+' (W)';
}
var wbtn=document.getElementById('weaponBtn');
wbtn.addEventListener('click',cycleWeapon);
wbtn.addEventListener('touchstart',function(e){e.preventDefault();cycleWeapon();},{passive:false});

/* ── tier helper ─────────────────────────────────────────── */
function getTier(){
  if(level>=20) return 9;
  return Math.min(Math.floor((level-1)/2),9);
}

/* ── particle helpers ────────────────────────────────────── */
function addPart(x,y,vx,vy,life,r,g,b,sz){
  particles.push({x:x,y:y,vx:vx,vy:vy,life:life,ml:life,r:r,g:g,b:b,sz:sz});
}
function burst(x,y,big){
  var n=big?22:10;
  for(var i=0;i<n;i++){
    var a=rnd(0,6.28),spd=rnd(big?2:1,big?9:5);
    addPart(x,y,Math.cos(a)*spd,Math.sin(a)*spd-rnd(1,3),big?50:28,255,Math.floor(rnd(50,200)),0,rnd(3,big?9:5));
  }
  for(var i=0;i<(big?8:4);i++){
    var a=rnd(0,6.28),spd=rnd(0.5,2);
    addPart(x,y,Math.cos(a)*spd,Math.sin(a)*spd-1,rnd(40,65),180,180,180,rnd(5,12));
  }
}
function addPop(x,y,txt,col){
  pops.push({x:x,y:y,txt:txt,col:col,life:60,vy:-1.8});
}

/* ── spawn ───────────────────────────────────────────────── */
function spawnPlane(){
  var left=Math.random()<0.5;
  var ch=CHARS[Math.floor(rnd(0,CHARS.length))];
  var hp=Math.max(1,ch.hpM+Math.floor(level/2));
  var spd=(1.4+level*0.22+rnd(0,0.6))*ch.spdM*(left?1:-1);
  planes.push({
    x:left?-80:C.width+80, y:rnd(55,GY()*0.52),
    spd:spd, dir:left?1:-1,
    bTimer:Math.floor(rnd(60/ch.bFreq,130/ch.bFreq)),
    bFreq:ch.bFreq,
    color:ch.color, dark:ch.dark,
    hp:hp, maxHp:hp, hit:0,
    name:ch.name
  });
}
function spawnBomb(p){
  bombs.push({x:p.x,y:p.y,vy:2.5+level*0.32,wobble:rnd(0,6.28)});
}
function spawnPowerup(x,y){
  var types=['rapid','shield','star'];
  if(level>=5) types.push('candy');
  if(level>=10) types.push('bomb_all');
  var t=types[Math.floor(rnd(0,types.length))];
  powerups.push({x:x,y:y,vy:1.2,type:t,rot:0,life:380});
}
function spawnMessenger(lv){
  var msg=LVLMSG[(lv-2)%LVLMSG.length];
  messenger={x:0-120,y:GY()*0.22,spd:2.6,msg:msg,wave:0};
}
function addConfetti(){
  for(var i=0;i<180;i++){
    confetti.push({
      x:rnd(0,C.width),y:rnd(-120,-10),
      vx:rnd(-2,2),vy:rnd(2,5),
      r:Math.floor(rnd(0,256)),g:Math.floor(rnd(0,256)),b:Math.floor(rnd(0,256)),
      sz:rnd(4,10),rot:rnd(0,6.28),rspd:rnd(-0.12,0.12)
    });
  }
}

/* ── DRAW: background ────────────────────────────────────── */
function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,C.height*0.85);
  g.addColorStop(0,'#02030e');g.addColorStop(0.45,'#080b25');g.addColorStop(1,'#180e35');
  ctx.fillStyle=g;ctx.fillRect(0,0,C.width,C.height*0.85);
  var mx=C.width*0.82,my=C.height*0.11;
  ctx.save();ctx.shadowBlur=30;ctx.shadowColor='rgba(255,255,200,0.4)';
  ctx.fillStyle='#fffff0';ctx.beginPath();ctx.arc(mx,my,30,0,6.28);ctx.fill();ctx.shadowBlur=0;
  var cr=[[10,-8,6],[-11,5,4],[3,13,5]];
  ctx.fillStyle='#ddd8a8';
  for(var i=0;i<cr.length;i++){ctx.beginPath();ctx.arc(mx+cr[i][0],my+cr[i][1],cr[i][2],0,6.28);ctx.fill();}
  ctx.restore();
}
function drawStars(){
  for(var i=0;i<stars.length;i++){
    var s=stars[i];s.tw+=0.03;
    ctx.fillStyle='rgba(255,255,255,'+(0.5+0.5*Math.sin(s.tw))+')';
    ctx.beginPath();ctx.arc(s.x%C.width,s.y%(C.height*0.75),s.r,0,6.28);ctx.fill();
  }
}
function drawClouds(){
  for(var i=0;i<clouds.length;i++){
    var cl=clouds[i];cl.x-=cl.spd;if(cl.x<-cl.sz*2.5) cl.x=C.width+cl.sz;
    ctx.fillStyle='rgba(255,255,255,'+cl.al+')';
    ctx.beginPath();
    ctx.arc(cl.x,cl.y,cl.sz,0,6.28);
    ctx.arc(cl.x+cl.sz*0.9,cl.y-8,cl.sz*0.65,0,6.28);
    ctx.arc(cl.x-cl.sz*0.75,cl.y-4,cl.sz*0.55,0,6.28);
    ctx.fill();
  }
}
function drawGround(){
  var gy=GY();
  var g=ctx.createLinearGradient(0,gy,0,C.height);
  g.addColorStop(0,'#3a581a');g.addColorStop(0.3,'#2a4010');g.addColorStop(1,'#111a06');
  ctx.fillStyle=g;ctx.fillRect(0,gy,C.width,C.height-gy);
  ctx.strokeStyle='#5aaa2e';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(C.width,gy);ctx.stroke();
  for(var x=30;x<C.width;x+=45){
    ctx.strokeStyle='#6abb38';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x-5,gy-10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+5,gy);ctx.lineTo(x+10,gy-12);ctx.stroke();
  }
}

/* ── DRAW: tank ──────────────────────────────────────────── */
function drawTank(tx,ty,al){
  var tier=getTier();
  var T=TIER[Math.min(tier,9)];
  var alpha=(al!==undefined)?al:1;
  if(alpha<1) ctx.globalAlpha=alpha;
  ctx.save();ctx.translate(tx,ty);

  /* shadow */
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath();ctx.ellipse(0,4,54+tier*3,10,0,0,6.28);ctx.fill();

  /* tracks */
  var tw=48+tier*2;
  ctx.fillStyle=T.trk;ctx.strokeStyle='#555';ctx.lineWidth=2;
  ctx.roundRect(-tw,-18,tw*2,20,10);ctx.fill();ctx.stroke();
  for(var xi=-tw+4;xi<tw;xi+=16){
    ctx.fillStyle='#4a4a4a';ctx.roundRect(xi,-16,10,16,3);ctx.fill();
  }

  /* body */
  var bw=38+tier*2;
  var bg=ctx.createLinearGradient(-bw,-50,bw,-20);
  bg.addColorStop(0,T.body);bg.addColorStop(1,T.dark);
  ctx.fillStyle=bg;ctx.strokeStyle=T.dark;ctx.lineWidth=2;
  ctx.roundRect(-bw,-48,bw*2,32,6);ctx.fill();ctx.stroke();

  /* tier decorations */
  if(tier>=2){
    ctx.strokeStyle=T.acc;ctx.lineWidth=2;ctx.globalAlpha=alpha*0.45;
    ctx.beginPath();ctx.moveTo(-bw,-38);ctx.lineTo(bw,-38);ctx.stroke();
    ctx.globalAlpha=alpha;
  }
  if(tier>=4){
    ctx.fillStyle=T.acc;ctx.font='bold 9px monospace';ctx.textAlign='center';
    ctx.fillText('*',-20,-30);ctx.fillText('*',20,-30);
  }
  if(tier>=6){
    ctx.shadowBlur=14;ctx.shadowColor=T.acc;
    ctx.strokeStyle=T.acc;ctx.lineWidth=2;
    ctx.roundRect(-bw,-48,bw*2,32,6);ctx.stroke();ctx.shadowBlur=0;
  }
  if(tier>=9){
    var hue=(Date.now()/10)%360;
    ctx.shadowBlur=22;ctx.shadowColor='hsl('+hue+',100%,60%)';
    ctx.strokeStyle='hsl('+hue+',100%,60%)';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,-22,bw+6,34,0,0,6.28);ctx.stroke();ctx.shadowBlur=0;
  }

  /* turret */
  var tg=ctx.createLinearGradient(-22,-72,22,-44);
  tg.addColorStop(0,T.body);tg.addColorStop(1,T.dark);
  ctx.fillStyle=tg;ctx.strokeStyle=T.dark;ctx.lineWidth=2;
  ctx.roundRect(-22,-72,44,28,10);ctx.fill();ctx.stroke();

  /* barrels */
  ctx.fillStyle=T.dark;ctx.strokeStyle='#111';ctx.lineWidth=1.5;
  if(T.bar===1){
    ctx.roundRect(-7,-108,14,48,4);ctx.fill();ctx.stroke();
    ctx.fillStyle='#1a1a1a';ctx.roundRect(-9,-114,18,10,3);ctx.fill();
  } else if(T.bar===2){
    ctx.roundRect(-13,-108,10,48,3);ctx.fill();ctx.stroke();
    ctx.roundRect(3,-108,10,48,3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#1a1a1a';
    ctx.roundRect(-15,-114,12,10,3);ctx.fill();
    ctx.roundRect(1,-114,12,10,3);ctx.fill();
  } else {
    ctx.roundRect(-18,-105,9,44,3);ctx.fill();ctx.stroke();
    ctx.roundRect(-4,-110,9,50,3);ctx.fill();ctx.stroke();
    ctx.roundRect(10,-105,9,44,3);ctx.fill();ctx.stroke();
  }

  /* muzzle flash */
  if(tank.flash>0){
    var fa=tank.flash/6;
    ctx.shadowBlur=20;ctx.shadowColor='#ffee00';
    ctx.fillStyle='rgba(255,220,80,'+fa+')';
    ctx.beginPath();ctx.arc(0,-116,16*fa,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(255,255,200,'+(fa*0.8)+')';
    ctx.beginPath();ctx.arc(0,-116,7*fa,0,6.28);ctx.fill();
    ctx.shadowBlur=0;tank.flash--;
  }

  /* shield */
  if(shield>0){
    var sa=0.4+0.4*Math.sin(Date.now()/200);
    ctx.strokeStyle='rgba(80,180,255,'+sa+')';ctx.lineWidth=5;
    ctx.shadowBlur=22;ctx.shadowColor='#40aaff';
    ctx.beginPath();ctx.ellipse(0,-40,62+tier*2,72,0,0,6.28);ctx.stroke();ctx.shadowBlur=0;
  }

  /* double shot glow */
  if(doubleShot>0){
    var da=0.3+0.3*Math.sin(Date.now()/150);
    ctx.strokeStyle='rgba(255,100,255,'+da+')';ctx.lineWidth=4;
    ctx.shadowBlur=16;ctx.shadowColor='#ff44ff';
    ctx.beginPath();ctx.ellipse(0,-20,bw+10,55,0,0,6.28);ctx.stroke();ctx.shadowBlur=0;
  }

  /* name label */
  ctx.font='bold 11px monospace';ctx.textAlign='center';
  ctx.fillStyle=T.acc;ctx.shadowBlur=6;ctx.shadowColor=T.acc;
  ctx.fillText(T.lbl,0,13);ctx.shadowBlur=0;
  ctx.textAlign='left';
  ctx.restore();
  if(alpha<1) ctx.globalAlpha=1;
}

/* ── DRAW: plane ─────────────────────────────────────────── */
function drawPlane(p){
  ctx.save();ctx.translate(p.x,p.y);
  if(p.dir<0) ctx.scale(-1,1);
  if(p.hit>0){ctx.globalAlpha=0.4+0.6*(p.hit%3===0?1:0);p.hit--;}
  /* trail */
  for(var t=1;t<=4;t++){
    ctx.fillStyle='rgba(200,200,255,'+(0.11/t)+')';
    ctx.beginPath();ctx.arc(-38-t*12,0,8+t*2,0,6.28);ctx.fill();
  }
  /* fuselage */
  ctx.fillStyle=p.color;ctx.strokeStyle=p.dark;ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,40,13,0,0,6.28);ctx.fill();ctx.stroke();
  /* nose */
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.moveTo(35,0);ctx.lineTo(56,-4);ctx.lineTo(56,4);ctx.closePath();ctx.fill();
  /* wings */
  ctx.strokeStyle=p.dark;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-2,-10);ctx.lineTo(-8,-38);ctx.lineTo(24,-10);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-2,10);ctx.lineTo(-6,30);ctx.lineTo(18,10);ctx.closePath();ctx.fill();ctx.stroke();
  /* tail */
  ctx.fillStyle=p.dark;
  ctx.beginPath();ctx.moveTo(-32,-6);ctx.lineTo(-46,-22);ctx.lineTo(-26,-6);ctx.closePath();ctx.fill();
  /* window */
  ctx.fillStyle='#aaeeff';ctx.strokeStyle='#66bbdd';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(14,-2,8,5.5,0,0,6.28);ctx.fill();ctx.stroke();
  /* hp bar */
  if(p.maxHp>1){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-30,-55,60,6);
    ctx.fillStyle=p.hp/p.maxHp>0.5?'#44ff44':'#ff4444';
    ctx.fillRect(-30,-55,60*(p.hp/p.maxHp),6);
  }
  ctx.globalAlpha=1;ctx.restore();
  /* name label — drawn outside flip transform */
  ctx.save();ctx.translate(p.x,p.y-50);
  ctx.font='bold 13px monospace';ctx.textAlign='center';
  ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(p.name,0,0);
  ctx.fillStyle='#fff';ctx.fillText(p.name,0,0);
  ctx.restore();
}

/* ── DRAW: messenger plane ───────────────────────────────── */
function drawMessenger(){
  if(!messenger) return;
  messenger.x+=messenger.spd;
  messenger.wave+=0.08;
  if(messenger.x>C.width+250){messenger=null;return;}
  var mx=messenger.x,my=messenger.y;

  /* special gold plane */
  ctx.save();ctx.translate(mx,my);
  ctx.shadowBlur=18;ctx.shadowColor='#ffee00';
  ctx.fillStyle='#ffffff';ctx.strokeStyle='#ddcc00';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,38,12,0,0,6.28);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffee44';
  ctx.beginPath();ctx.moveTo(33,0);ctx.lineTo(52,-3);ctx.lineTo(52,3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffffff';ctx.strokeStyle='#ddcc00';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-2,-9);ctx.lineTo(-7,-33);ctx.lineTo(22,-9);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-2,9);ctx.lineTo(-5,27);ctx.lineTo(16,9);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#ddcc00';
  ctx.beginPath();ctx.moveTo(-30,-5);ctx.lineTo(-44,-20);ctx.lineTo(-24,-5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffee00';ctx.font='14px serif';ctx.textAlign='center';ctx.fillText('\u2605',0,4);
  ctx.shadowBlur=0;ctx.restore();

  /* waving flag */
  var fLen=Math.min(300,messenger.msg.length*12+50);
  var seg=14;
  ctx.save();
  /* flag rope */
  ctx.strokeStyle='rgba(200,200,200,0.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(mx-40,my);ctx.lineTo(mx-40-fLen,my);ctx.stroke();
  /* flag body */
  ctx.beginPath();
  for(var s=0;s<=seg;s++){
    var fx=mx-40-(s/seg)*fLen;
    var wy=Math.sin(messenger.wave+s*0.65)*8;
    if(s===0) ctx.moveTo(fx,my-20+wy); else ctx.lineTo(fx,my-20+wy);
  }
  for(var s=seg;s>=0;s--){
    var fx=mx-40-(s/seg)*fLen;
    var wy=Math.sin(messenger.wave+s*0.65)*8;
    ctx.lineTo(fx,my+20+wy);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(200,30,30,0.92)';ctx.fill();
  ctx.strokeStyle='rgba(160,10,10,0.7)';ctx.lineWidth=1;ctx.stroke();
  /* flag text */
  ctx.font='bold 13px monospace';ctx.textAlign='center';
  var tx=mx-40-fLen/2,ty=my+5;
  ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(messenger.msg,tx,ty);
  ctx.fillStyle='#fff';ctx.fillText(messenger.msg,tx,ty);
  ctx.restore();
}

/* ── DRAW: bullets ───────────────────────────────────────── */
function drawBullets(){
  for(var i=0;i<bullets.length;i++){
    var b=bullets[i];
    if(b.laser) continue;
    var col=b.type==='spread'?'#ff8800':b.type==='quad'?'#aa44ff':'#ffff88';
    ctx.shadowBlur=16;ctx.shadowColor='#ffe000';
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(b.x,b.y,5.5,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,6.28);ctx.fill();
    ctx.shadowBlur=0;
    for(var t=1;t<=3;t++){
      ctx.fillStyle='rgba(255,200,0,'+(0.2/t)+')';
      ctx.beginPath();ctx.arc(b.x,b.y+t*9,5.5-t,0,6.28);ctx.fill();
    }
  }
}

/* ── DRAW: laser ─────────────────────────────────────────── */
function drawLaser(){
  if(laserTimer<=0) return;
  var x=tank.x,gy=GY(),al=laserTimer/14;
  ctx.save();
  ctx.shadowBlur=40;ctx.shadowColor='rgba(255,0,0,0.8)';
  ctx.strokeStyle='rgba(255,50,50,'+al+')';ctx.lineWidth=14;
  ctx.beginPath();ctx.moveTo(x,gy-115);ctx.lineTo(x,0);ctx.stroke();
  ctx.strokeStyle='rgba(255,180,180,'+(al*0.8)+')';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x,gy-115);ctx.lineTo(x,0);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,'+(al*0.5)+')';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,gy-115);ctx.lineTo(x,0);ctx.stroke();
  ctx.shadowBlur=0;ctx.restore();
  laserTimer--;
}

/* ── DRAW: bombs ─────────────────────────────────────────── */
function drawBombs(){
  for(var i=0;i<bombs.length;i++){
    var b=bombs[i];b.wobble+=0.15;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(b.wobble)*0.1);
    ctx.fillStyle='#333';ctx.strokeStyle='#555';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(0,0,7,11,0,0,6.28);ctx.fill();ctx.stroke();
    ctx.fillStyle='#555';
    ctx.beginPath();ctx.moveTo(-5,6);ctx.lineTo(-13,17);ctx.lineTo(-3,10);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(5,6);ctx.lineTo(13,17);ctx.lineTo(3,10);ctx.closePath();ctx.fill();
    var fa=0.7+0.3*Math.sin(Date.now()/80);
    ctx.fillStyle='rgba(255,100,0,'+fa+')';ctx.shadowBlur=8;ctx.shadowColor='#ffcc00';
    ctx.beginPath();ctx.arc(0,-13,3,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.restore();
  }
}

/* ── DRAW: powerups ──────────────────────────────────────── */
function drawPowerups(){
  for(var i=0;i<powerups.length;i++){
    var p=powerups[i];p.rot+=0.06;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    var glow=0.7+0.3*Math.sin(Date.now()/200);
    ctx.globalAlpha=glow;ctx.font='26px serif';ctx.textAlign='center';
    var ico={rapid:'\u26A1',shield:'\uD83D\uDEE1',star:'\uD83C\uDF1F',candy:'\uD83C\uDF6C',bomb_all:'\uD83D\uDCA3'}[p.type]||'\u2B50';
    ctx.shadowBlur=12;ctx.shadowColor='#ffcc00';
    ctx.fillText(ico,0,8);ctx.shadowBlur=0;
    ctx.globalAlpha=1;ctx.restore();
  }
}

/* ── DRAW: particles ─────────────────────────────────────── */
function drawParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];var a=p.life/p.ml;
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.vx*=0.98;
    ctx.fillStyle='rgba('+p.r+','+p.g+','+p.b+','+a+')';
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a,0,6.28);ctx.fill();
    p.life--;if(p.life<=0) particles.splice(i,1);
  }
}

/* ── DRAW: score popups ──────────────────────────────────── */
function drawPops(){
  ctx.textAlign='center';
  for(var i=pops.length-1;i>=0;i--){
    var s=pops[i];var a=s.life/60;
    ctx.globalAlpha=a;ctx.fillStyle=s.col;
    ctx.font='bold 18px monospace';ctx.fillText(s.txt,s.x,s.y);
    s.y+=s.vy;s.life--;if(s.life<=0) pops.splice(i,1);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
}

/* ── DRAW: confetti ──────────────────────────────────────── */
function drawConfetti(){
  for(var i=confetti.length-1;i>=0;i--){
    var c=confetti[i];
    c.x+=c.vx;c.y+=c.vy;c.rot+=c.rspd;
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
    ctx.fillStyle='rgb('+c.r+','+c.g+','+c.b+')';
    ctx.fillRect(-c.sz/2,-c.sz/2,c.sz,c.sz);
    ctx.restore();
    if(c.y>C.height+20) confetti.splice(i,1);
  }
}

/* ── DRAW: HUD ───────────────────────────────────────────── */
function drawHUD(){
  ctx.textAlign='left';
  /* score */
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(8,8,220,30);
  ctx.strokeStyle='#ffee00';ctx.lineWidth=2;ctx.strokeRect(8,8,220,30);
  ctx.fillStyle='#ffee00';ctx.font='bold 15px monospace';ctx.fillText('SKOR: '+score,16,28);
  /* level */
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(8,44,185,28);
  ctx.strokeStyle='#88ffcc';ctx.strokeRect(8,44,185,28);
  ctx.fillStyle='#88ffcc';ctx.font='bold 14px monospace';ctx.fillText('LEVEL: '+level,16,62);
  /* lives */
  ctx.textAlign='right';
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(C.width-175,8,168,30);
  ctx.strokeStyle='#ff6688';ctx.strokeRect(C.width-175,8,168,30);
  var hearts='';for(var i=0;i<maxLives;i++) hearts+=(i<lives)?'\u2764':'\u25A1';
  ctx.fillStyle='#ff6688';ctx.font='bold 17px monospace';ctx.fillText(hearts,C.width-12,28);
  /* weapon */
  ctx.textAlign='left';
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(8,78,200,26);
  ctx.strokeStyle='#aaaaff';ctx.strokeRect(8,78,200,26);
  ctx.fillStyle='#aaaaff';ctx.font='bold 12px monospace';ctx.fillText('SENJATA: '+curWeapon().name,13,95);
  /* buffs */
  var iy=110;
  if(rapidFire>0){ctx.fillStyle='#ffee00';ctx.fillText('\u26A1RAPID '+Math.ceil(rapidFire/60)+'s',13,iy);iy+=18;}
  if(shield>0){ctx.fillStyle='#40aaff';ctx.fillText('\uD83D\uDEE1PELINDUNG '+Math.ceil(shield/60)+'s',13,iy);iy+=18;}
  if(doubleShot>0){ctx.fillStyle='#ff88ff';ctx.fillText('\uD83C\uDF1F DOUBLE SHOT '+Math.ceil(doubleShot/60)+'s',13,iy);iy+=18;}
  if(cloneTimer>0){ctx.fillStyle='#ff88cc';ctx.fillText('\uD83C\uDF6C CLONE '+Math.ceil(cloneTimer/60)+'s',13,iy);iy+=18;}
  if(laserCD>0){ctx.fillStyle='#ff4444';ctx.fillText('\uD83D\uDD34 LASER CD '+Math.ceil(laserCD/60)+'s',13,iy);}
  /* combo */
  if(combo>=2){
    var cp=Math.min(combo/10,1);
    ctx.textAlign='center';
    ctx.font='bold '+(18+Math.min(combo,10))+'px monospace';
    var cr=Math.floor(255*cp),cg=Math.floor(255*(1-cp));
    ctx.fillStyle='rgb('+cr+','+cg+',0)';
    ctx.shadowBlur=12;ctx.shadowColor='rgb('+cr+','+cg+',0)';
    ctx.fillText(combo+'x COMBO!',C.width/2,45);ctx.shadowBlur=0;
  }
  ctx.textAlign='left';
}

/* ── level banner ────────────────────────────────────────── */
var bannerTO=null;
function showLevelBanner(lv){

  el.classList.add('show');
  if(bannerTO) clearTimeout(bannerTO);
  bannerTO=setTimeout(function(){el.classList.remove('show');},2000);
}

/* ── reset ───────────────────────────────────────────────── */
function resetGame(){
  score=0;lives=3;maxLives=5;level=1;
  bullets=[];planes=[];bombs=[];particles=[];pops=[];powerups=[];confetti=[];
  fireTimer=0;planeTimer=0;planeInterval=150;
  levelTimer=0;combo=0;comboTimer=0;
  rapidFire=0;shield=0;shakeMag=0;
  laserTimer=0;laserCD=0;doubleShot=0;cloneTimer=0;
  wIdx=0;messenger=null;victoryTimer=0;inputDelay=40;
  tank.x=C.width/2;tank.inv=0;tank.flash=0;
  updateWBtn();
}

/* ── fire ────────────────────────────────────────────────── */
function doFire(){
  var w=curWeapon();
  var gy=GY(),bx=tank.x,by=gy-115;
  var spd=13+level*0.3;

  if(w.id==='laser'){
    if(laserCD>0) return;
    laserTimer=16;laserCD=90;sndLaser();doShake(6);
    for(var i=planes.length-1;i>=0;i--){
      var p=planes[i];
      if(Math.abs(p.x-tank.x)<70){
        burst(p.x,p.y,true);sndBoom(true);doShake(9);
        if(Math.random()<0.28) spawnPowerup(p.x,p.y);
        var pts=250*level*Math.max(1,combo);score+=pts;
        combo++;comboTimer=220;addPop(p.x,p.y,'+'+pts+' LASER!','#ff8888');
        planes.splice(i,1);
      }
    }
    return;
  }

  /* build shots */
  var shots=[];
  if(w.id==='single'){
    shots=[{x:bx,y:by,vx:0,vy:-spd,type:'single'}];
    if(doubleShot>0){
      shots.push({x:bx-18,y:by,vx:-0.8,vy:-spd,type:'single'});
      shots.push({x:bx+18,y:by,vx:0.8,vy:-spd,type:'single'});
    }
  } else if(w.id==='double'){
    shots=[{x:bx-9,y:by,vx:0,vy:-spd,type:'double'},{x:bx+9,y:by,vx:0,vy:-spd,type:'double'}];
  } else if(w.id==='spread'){
    shots=[{x:bx,y:by,vx:-3.5,vy:-spd,type:'spread'},{x:bx,y:by,vx:0,vy:-spd,type:'spread'},{x:bx,y:by,vx:3.5,vy:-spd,type:'spread'}];
  } else if(w.id==='quad'){
    shots=[{x:bx-14,y:by,vx:-3,vy:-spd,type:'quad'},{x:bx-4,y:by,vx:-1,vy:-spd,type:'quad'},{x:bx+4,y:by,vx:1,vy:-spd,type:'quad'},{x:bx+14,y:by,vx:3,vy:-spd,type:'quad'}];
  }

  /* clone fires too */
  if(cloneTimer>0){
    var extra=[];
    for(var i=0;i<shots.length;i++){
      extra.push({x:shots[i].x-90,y:shots[i].y,vx:shots[i].vx,vy:shots[i].vy,type:shots[i].type});
      extra.push({x:shots[i].x+90,y:shots[i].y,vx:shots[i].vx,vy:shots[i].vy,type:shots[i].type});
    }
    shots=shots.concat(extra);
  }

  for(var i=0;i<shots.length;i++) bullets.push(shots[i]);
  tank.flash=6;sndShoot();doShake(2);
}

/* ── apply powerup ───────────────────────────────────────── */
function applyPup(p){
  sndPowerup();
  if(p.type==='rapid')   { rapidFire=360; addPop(p.x,p.y,'\u26A1 RAPID!','#ffee00'); }
  if(p.type==='shield')  { shield=360;    addPop(p.x,p.y,'\uD83D\uDEE1 PELINDUNG!','#40aaff'); }
  if(p.type==='star')    { doubleShot=480; lives=Math.min(lives+1,maxLives); addPop(p.x,p.y,'\uD83C\uDF1F DOUBLE+NYAWA!','#ffaaff'); }
  if(p.type==='candy')   { cloneTimer=720; addPop(p.x,p.y,'\uD83C\uDF6C CLONE TANK!','#ff88cc'); }
  if(p.type==='bomb_all'){ 
    var n=planes.length;
    for(var i=planes.length-1;i>=0;i--){ burst(planes[i].x,planes[i].y,true); }
    score+=n*150*level; planes=[]; bombs=[];
    addPop(C.width/2,C.height*0.4,'\uD83D\uDCA5 BOOM SEMUA!!','#ff4400');
    doShake(22);sndBoom(true);
  }
}

/* ── canvas click (game over buttons) ───────────────────── */
function handleGOClick(mx,my){
  if(STATE!=='gameover') return;
  var cx=C.width/2,cy=C.height/2;
  if(mx>=cx-130&&mx<=cx+130&&my>=cy+36&&my<=cy+84){ STATE='play';resetGame(); }
  if(mx>=cx-130&&mx<=cx+130&&my>=cy+95&&my<=cy+135){ window.location.href=document.getElementById('homeBtn').href; }
}
C.addEventListener('click',function(e){ handleGOClick(e.clientX,e.clientY); });
C.addEventListener('touchend',function(e){ if(e.changedTouches.length) handleGOClick(e.changedTouches[0].clientX,e.changedTouches[0].clientY); });

/* ── main loop ───────────────────────────────────────────── */
function loop(){
  requestAnimationFrame(loop);

  if(shakeMag>0.3){shakeX=(Math.random()-0.5)*shakeMag*2;shakeY=(Math.random()-0.5)*shakeMag*2;shakeMag*=0.82;}
  else{shakeX=0;shakeY=0;shakeMag=0;}

  ctx.save();ctx.translate(shakeX,shakeY);
  drawSky();drawStars();drawClouds();drawGround();

  if(inputDelay>0) inputDelay--;

  /* ── START ── */
  if(STATE==='start'){
    drawTank(C.width/2,GY());
    drawStart();
    if(keys.fire&&inputDelay<=0){STATE='play';resetGame();}
    ctx.restore();return;
  }

  /* ── GAME OVER ── */
  if(STATE==='gameover'){
    drawParticles();drawGameOver();
    if(keys.fire&&inputDelay<=0){STATE='play';resetGame();}
    ctx.restore();return;
  }

  /* ── VICTORY ── */
  if(STATE==='victory'){
    drawVictory();
    if(keys.fire&&inputDelay<=0){STATE='play';resetGame();}
    ctx.restore();return;
  }

  /* ══════════════════ PLAY ══════════════════ */
  if(keys.left)  tank.x=Math.max(55,tank.x-tank.spd);
  if(keys.right) tank.x=Math.min(C.width-55,tank.x+tank.spd);

  fireTimer++;
  var w=curWeapon();
  var cd=rapidFire>0?Math.max(5,Math.floor(w.cd*0.4)):w.cd;
  if(w.id==='laser') cd=70;
  if(keys.fire&&fireTimer>=cd){fireTimer=0;doFire();}

  if(rapidFire>0) rapidFire--;
  if(shield>0) shield--;
  if(comboTimer>0){comboTimer--;if(comboTimer<=0) combo=0;}
  if(tank.inv>0) tank.inv--;
  if(laserTimer>0) laserTimer--;
  if(laserCD>0) laserCD--;
  if(doubleShot>0) doubleShot--;
  if(cloneTimer>0) cloneTimer--;

  /* spawn planes */
  planeTimer++;
  var maxP=Math.min(3+Math.floor(level/2),10);
  if(planeTimer>=planeInterval&&planes.length<maxP){
    spawnPlane();planeTimer=0;planeInterval=Math.max(38,150-level*12);
  }

  /* level up */
  levelTimer++;
  if(levelTimer>=700){
    levelTimer=0;
    if(level>=20){
      STATE='victory';inputDelay=40;sndVictory();addConfetti();addConfetti();
    } else {
      level++;sndLevelUp();showLevelBanner(level);doShake(7);
      updateWBtn();
      if(level>=2) spawnMessenger(level);
      if(level%3===0){lives=Math.min(lives+1,maxLives);addPop(C.width/2,C.height*0.45,'+1 NYAWA!','#ff6688');}
      if(level%5===0){rapidFire=Math.max(rapidFire,300);addPop(C.width/2,C.height*0.55,'\u26A1 BONUS RAPID!','#ffee00');}
    }
  }

  var gy=GY();

  /* update bullets */
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.y<-10||b.x<-20||b.x>C.width+20) bullets.splice(i,1);
  }

  /* update planes */
  for(var pi=planes.length-1;pi>=0;pi--){
    var p=planes[pi];p.x+=p.spd;p.bTimer--;
    if(p.bTimer<=0){spawnBomb(p);p.bTimer=Math.floor(rnd(60/p.bFreq,130/p.bFreq));}
    if(p.x>C.width+120||p.x<-120){planes.splice(pi,1);continue;}
    /* bullet hits */
    for(var bi=bullets.length-1;bi>=0;bi--){
      var b=bullets[bi];
      if(Math.abs(b.x-p.x)<58&&Math.abs(b.y-p.y)<30){
        bullets.splice(bi,1);p.hp--;p.hit=8;
        if(p.hp<=0){
          burst(p.x,p.y,true);sndBoom(true);doShake(9);
          if(Math.random()<0.28) spawnPowerup(p.x,p.y);
          planes.splice(pi,1);
          combo++;comboTimer=220;
          var pts=100*level*Math.max(1,combo);score+=pts;
          addPop(p.x,p.y,'+'+pts,combo>=3?'#ffee00':'#88ffcc');
        } else { burst(b.x,b.y,false);sndBoom(false); }
        break;
      }
    }
  }

  /* update bombs */
  for(var i=bombs.length-1;i>=0;i--){
    var b=bombs[i];b.y+=b.vy;
    if(b.y>gy){burst(b.x,gy,false);sndBoom(false);bombs.splice(i,1);continue;}
    if(shield<=0&&tank.inv<=0&&Math.abs(b.x-tank.x)<52&&b.y>gy-68){
      burst(tank.x,gy-30,true);sndHit();bombs.splice(i,1);
      lives--;tank.inv=150;doShake(18);
      if(lives<=0){STATE='gameover';inputDelay=40;}
    }
  }

  /* update powerups */
  for(var i=powerups.length-1;i>=0;i--){
    var p=powerups[i];p.y+=p.vy;p.life--;
    if(p.y>gy||p.life<=0){powerups.splice(i,1);continue;}
    /* pick up by main or clone tank */
    var pick=Math.abs(p.x-tank.x)<58&&Math.abs(p.y-gy)<88;
    if(!pick&&cloneTimer>0){pick=Math.abs(p.x-(tank.x-90))<55&&Math.abs(p.y-gy)<88||Math.abs(p.x-(tank.x+90))<55&&Math.abs(p.y-gy)<88;}
    if(pick){applyPup(p);powerups.splice(i,1);}
  }

  /* DRAW */
  drawLaser();
  drawBullets();
  for(var i=0;i<planes.length;i++) drawPlane(planes[i]);
  drawMessenger();
  drawBombs();
  drawPowerups();

  /* clone tanks */
  if(cloneTimer>0){
    var ca=0.5+0.2*Math.sin(Date.now()/200);
    if(tank.x-90>40) drawTank(tank.x-90,gy,ca);
    if(tank.x+90<C.width-40) drawTank(tank.x+90,gy,ca);
  }

  /* main tank */
  var show=tank.inv<=0||(Math.floor(tank.inv/7)%2===0);
  if(show) drawTank(tank.x,gy);

  drawParticles();
  drawPops();
  drawHUD();

  ctx.restore();
}

loop();
</script>
